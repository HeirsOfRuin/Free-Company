# Publish the installable build to GitHub Pages.
#
# - Deploys ONLY from the repository's default branch, read at run time, so the
#   branch name is never hardcoded: the github-pages environment refuses other
#   branches, and Silk Road lost eight deploys to that. Pushes to work branches
#   run the checks and skip the deploy.
# - Turns Pages on by itself (configure-pages with enablement) on a repo that
#   has never had it. If Pages is already set to deploy from a branch, switch it
#   once to Settings > Pages > Source: GitHub Actions.
# - Rebuilds from source instead of trusting committed output, stamps the build
#   id, and refuses to upload a site missing its manifest, worker or icons: a
#   404 manifest makes a browser decline the install without saying why.

name: Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
{{CI_SETUP}}
      - name: Test
        run: {{CI_TEST}}
      - name: Build
        run: {{CI_BUILD}}
      - name: Check the installable build is complete
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js {{CI_ICONS}}; do
            test -s "{{SITE_DIR}}/$f" || { echo "missing or empty: {{SITE_DIR}}/$f"; exit 1; }
          done
          ! grep -rl "__BUILD_ID__" {{SITE_DIR}} || { echo "build id not stamped"; exit 1; }
          grep -q 'rel="manifest"' {{SITE_DIR}}/index.html
          echo "site is complete"
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: {{SITE_DIR}}

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
