- id: start
  title: The Gate
  text: |
    Rain on the road, and the gate already shut. A guard looks down at you
    from the wall and does not hurry.

    "Late," he says. "Everyone is late tonight."
  choices:
    - id: knock
      text: Knock, and give your name.
      next: yard
    - id: wait
      text: Wait under the eaves until morning.
      next: morning

- id: yard
  title: The Yard
  text: |
    The wicket opens a hand's width. Inside, a fire, and three men who stop
    talking when you come in.
  choices:
    - id: sit
      text: Sit by the fire and say nothing.
      ending: welcome
    - id: ask
      text: Ask who they were waiting for.
      next: morning

- id: morning
  title: Morning
  text: |
    By first light the road is mud to the knee. The gate opens for a cart,
    and nobody asks who you are.
  choices:
    - id: in
      text: Walk in behind the cart.
      ending: unnoticed
