name: Deploy to GitHub Pages

on:
  # Pages is configured to deploy from the main branch directly, so this
  # workflow is not needed and would fail on every push if it auto-ran.
  # Left here, manual-only, in case the GitHub Actions source is ever
  # preferred over branch deployment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turns Pages on from the workflow itself using the pages: write
        # permission above, rather than requiring someone to flip the repo
        # setting by hand first.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
