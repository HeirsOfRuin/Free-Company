/* ----------------------------------------------------- ledger/journal - */
function coin(amount, item){
  amount = Math.round(amount);
  if(amount === 0) return 0;
  S.treasury += amount;
  S.ledger.push({turn:S.turn, item, out:amount<0?-amount:0, in:amount>0?amount:0, bal:Math.round(S.treasury)});
  if(S.ledger.length > 400) S.ledger.splice(0, S.ledger.length - 400);
  return amount;
}
/* Entries are stored newest-first for cheap trimming, but a season posts
   narration, then its figures, then its dead — so within one season the
   raw order reads backwards. `seq` preserves the order things actually
   happened, and the view sorts by turn descending, seq ascending. */
function post(kind, text){
  S.journalSeq = (S.journalSeq || 0) + 1;
  S.journal.unshift({turn:S.turn, seq:S.journalSeq, kind, text});
  if(S.journal.length > 140) S.journal.length = 140;
}
function liveLts(){ return S.lieutenants.filter(l => l.alive); }
function ltName(l){ return l.byname ? `${l.name} ${l.byname}` : l.name; }
function someLt(){ const l = liveLts(); return l.length ? ltName(pick(l)) : "your senior corporal"; }

/* Token substitution for every piece of flavor text. */
function fill(tpl, ctx){
  ctx = ctx || {};
  return tpl
    .replace(/\{lt\}/g, () => ctx.lt || someLt())
    .replace(/\{fac\}/g, () => ctx.fac || (S.underContract ? facOf(S.underContract).name : "your employer"))
    .replace(/\{town\}/g, () => ctx.town || pick(TOWNS))
    .replace(/\{co\}/g, () => S.captainName)
    .replace(/\{riv\}/g, () => ctx.riv || (S.rivals[0] ? S.rivals[0].name : "a rival captain"))
    .replace(/\{n\}/g, () => ctx.n !== undefined ? fmt(ctx.n) : "some");
}
function flavor(bucket, ctx){ return fill(pick(FLAVOR[bucket]), ctx); }

/* ------------------------------------------------------------- mods -
   THE single modifier pipeline. Every bonus from investments, attributes,
   equipment and difficulty is derived here, and both the numbers shown to
   the player and the numbers used to resolve a season read from it. Two
   independent derivations of the same value is how a displayed figure and
   a resolved one drift apart; there is only one here. */
function has(inv){ return S.investments.includes(inv); }
function kitOf(slot){ return KIT[slot].find(k => k.id === S.kit[slot]) || KIT[slot][0]; }
function kitDread(){
  return ["armour","horse","blade","wardrobe"].reduce((a,s) => a + (kitOf(s).dread||0), 0);
}
function kitPresence(){
  return ["armour","horse","blade","wardrobe"].reduce((a,s) => a + (kitOf(s).presence||0), 0);
}
function mods(){
  const d = DIFFICULTY[S.difficulty] || DIFFICULTY.captain;
  const a = S.attrs;
  const dCorr = docTier("corridori"), dChan = docTier("chancery"),
        dArt  = docTier("articles"),  dBoot = docTier("booty"),
        dGua  = docTier("guastatori");
  return {
    // Presence and finery improve the terms you are offered.
    pay: d.pay * (1 + 0.02 * (a.presence - ATTR_BASE)) * (1 + 0.01 * kitPresence())
         * (1 + 0.05 * dChan),
    risk: d.risk,
    // Command keeps men alive; a surgeon and a baggage train do more.
    casualty: (1 - 0.02 * (a.command - ATTR_BASE))
              * (has("baggage") ? 0.85 : 1)
              * (has("surgeon") ? 0.75 : 1),
    // Cunning makes a town pay more to be left alone.
    take: (1 + 0.03 * (a.cunning - ATTR_BASE)) * (1 + 0.13 * dCorr),
    // Doctrine, all of it derived here so nothing reads a bonus twice.
    plunder: 1 + 0.15 * dBoot,
    battleMorale: 4 * dArt,
    loyaltyFloor: dArt >= 2 ? 12 : 0,
    breakCost: 1 - 0.15 * dChan,
    sapWall: 1 + 0.20 * dGua,
    sapCost: 1 - 0.18 * dGua,
    assaultOdds: 0.06 * dGua,
    scoutGround: dCorr >= 2,
    scoutFoe: dCorr >= 3,
    repGain: has("herald") ? 1.30 : 1.00,
    wageLoyaltyHit: has("paymaster") ? 8 : 15,
    restLoyalty: has("quarters") ? 12 : 8,
    garrison: has("quarters") ? 3 : 1,
    coalition: d.coalition * (1 - 0.03 * (a.constitution - ATTR_BASE)),
    dread: kitDread()
  };
}
/* Effective dread = what you have earned, plus what you wear. One place. */
function effDread(){ return clamp(S.dread + mods().dread, 0, 100); }

/* -------------------------------------------------------- composition -
   `strength()` is THE derived total. Nothing else adds the unit counts up,
   and nothing writes to S.units except applyLosses/addRecruits, so losses
   can never be applied twice or to a stale figure. */
function strength(u){ u = u || S.units; return u.maa + u.arch + u.inf; }
function frac(u, k){ const t = strength(u); return t > 0 ? u[k]/t : 0; }
function startStrength(){ return strength(S.startUnits); }

/* Distribute n casualties across unit types by weight, spilling into
   whatever is left when a type runs out — so a company of pure archers
   still bleeds when the order says men-at-arms should. */
function applyLosses(units, n, weights){
  n = Math.max(0, n);
  weights = weights || {maa:1/3, arch:1/3, inf:1/3};
  let left = n;
  for(let pass = 0; pass < 3 && left > 0.01; pass++){
    const avail = UNIT_IDS.filter(k => units[k] > 0);
    if(!avail.length) break;
    const wsum = avail.reduce((a,k) => a + (weights[k] || 0.001), 0);
    let took = 0;
    avail.forEach(k => {
      const want = left * ((weights[k] || 0.001) / wsum);
      const got = Math.min(units[k], want);
      units[k] -= got; took += got;
    });
    left -= took;
    if(took < 0.001) break;
  }
  return n - left;
}
function addRecruits(units, n, weights){
  weights = weights || {maa:0.3, arch:0.35, inf:0.35};
  UNIT_IDS.forEach(k => { units[k] += n * (weights[k] || 0); });
}
/* Recruiting is priced by what you are actually buying back. */
function recruitCostPer(){
  const w = {maa:0.3, arch:0.35, inf:0.35};
  return UNIT_IDS.reduce((a,k) => a + w[k]*UNITS[k].recruit, 0);
}

/* ------------------------------------------------------------ engine - */
/* Composition carries most of the "better troops cost more" weight now, so
   quality's influence on upkeep is reduced rather than removed. */
function upkeepPerLance(){ return wageBill() / Math.max(1, strength()); }
function wageBill(){
  const q = 0.85 + 0.30 * S.quality;
  return UNIT_IDS.reduce((a,k) => a + S.units[k]*UNITS[k].upkeep, 0) * q;
}
function maxLances(){ return startStrength() * CONFIG.maxLancesMult; }

/* ----------------------------------------------------------- battle -
   resolveRound() is a pure function of (battle, myOrder, rng-free Math.random)
   with no DOM contact, so the same code resolves a battle the player fights
   click by click, a battle waved through with "let them handle it", and a
   battle run ten thousand times by a measurement harness. There is no
   second path and therefore nothing to drift. */
/* What the PLAYER's doctrine does in a battle. This is deliberately a
   separate object passed into the resolver rather than something baked into
   orderEffect: orderEffect is called for both sides, and for the enemy AI's
   own evaluation, so a multiplier hidden inside it would silently buff the
   opponent. Nothing here is ever passed for b.them. */
function battleDoctrine(){
  const mult = {hold:1, volley:1, charge:1, refuse:1};
  const defence = {hold:1, volley:1, charge:1, refuse:1};
  let chargeSoften = 0;
  ["volley","hold","charge"].forEach(id => {
    const t = docTier(id);
    if(t > 0) mult[id] = DOCTRINE_ORDER_MULT[t];
    if(t >= DOCTRINE_MAX){
      if(id === "charge") chargeSoften = 0.35;  // broken country stops stopping you
      else defence[id] = 0.85;                  // and the drilled take fewer losses
    }
  });
  return {mult, defence, chargeSoften};
}
function orderAvailable(id, units, terrainId, battle, doc){
  const o = ORDERS[id];
  if(!o) return false;
  return !!o.need(units, terrainId, battle, doc);
}
function availableOrders(units, terrainId, battle, doc){
  return ORDER_IDS.filter(id => orderAvailable(id, units, terrainId, battle, doc));
}
/* Effectiveness of one side this round. The number the UI shows the player
   and the number the resolver consumes are this same call. */
function orderEffect(units, orderId, terrainId, morale, committed, doc){
  const o = ORDERS[orderId];
  let tm = TERRAIN[terrainId][orderId];
  if(typeof tm !== "number" || !isFinite(tm)){
    console.error("no terrain multiplier for", orderId, "on", terrainId);
    return 0;
  }
  // Charge III: bad ground stops being bad. Player side only.
  if(doc && doc.chargeSoften && orderId === "charge" && tm < 1) tm = tm + (1 - tm) * doc.chargeSoften;
  const raw = o.power(units);
  const v = raw * tm * (1 + morale/200) * (committed ? 1.5 : 1) * (doc ? doc.mult[orderId] : 1);
  return isFinite(v) ? v : 0;
}
function makeEnemy(strengthTarget, profileId, seed){
  const p = PROFILES[profileId];
  let mix;
  if(profileId === "militia")      mix = {maa:0.18, arch:0.32, inf:0.50};
  else if(profileId === "levy")    mix = {maa:0.45, arch:0.10, inf:0.45};
  else                             mix = {maa:0.32, arch:0.30, inf:0.38};
  const units = {};
  UNIT_IDS.forEach(k => { units[k] = Math.max(0, Math.round(strengthTarget * mix[k])); });
  return { units, morale: Math.round(rand(58, 80)), profile: profileId,
           banner: seed || randomSeed(), committed:false, name:p.name };
}
function startMorale(){
  return clamp(Math.round(45 + 0.30*S.loyalty + 20*S.quality + mods().battleMorale), 20, 100);
}
function newBattle(opts){
  opts = opts || {};
  const terrain = opts.terrain || pick(TERRAIN_IDS);
  const ratio = opts.ratio || rand(0.85, 1.10);
  const profile = opts.profile || pick(Object.keys(PROFILES));
  return {
    terrain, round:1, maxRounds: opts.maxRounds || 6,
    kind: opts.kind || "battle",            // battle | relief | coalition
    us: { units: {maa:S.units.maa, arch:S.units.arch, inf:S.units.inf},
          morale: startMorale(), committed:false },
    them: makeEnemy(Math.max(30, Math.round(strength() * ratio)), profile, opts.banner),
    log: [], over:null, reserveUsed:false
  };
}
/* The enemy's order for this round, from its behaviour profile. A levy
   charges into a defile because a levy would; that is exploitable on
   purpose, and readable once the player has seen it happen. */
function enemyOrder(b){
  const avail = availableOrders(b.them.units, b.terrain, b);
  if(!avail.length) return "refuse";
  /* Condottieri are professionals: they counter what you did last round.
     Militia and levies run to type, which is what makes them readable. */
  if(b.them.profile === "condottiere" && b.log.length && Math.random() < 0.72){
    const last = b.log[b.log.length-1].myOrder;
    let best = avail[0], bestScore = -Infinity;
    avail.forEach(id => {
      const sc = orderEffect(b.them.units, id, b.terrain, b.them.morale, false) * COUNTER[id][last];
      if(sc > bestScore){ bestScore = sc; best = id; }
    });
    return best;
  }
  const prefs = PROFILES[b.them.profile].prefer;
  for(const id of prefs){
    if(avail.includes(id) && Math.random() < 0.80) return id;
  }
  return avail.find(id => prefs.includes(id)) || avail[0] || "refuse";
}
/* The one resolver. Mutates the battle object and returns a description of
   what happened; callers do the narrating. */
function resolveRound(b, myOrder){
  const theirOrder = enemyOrder(b);
  const myCommit = b.us.committed, theirCommit = b.them.committed;
  b.us.committed = false; b.them.committed = false;

  const doc = battleDoctrine();
  const countered = COUNTER[myOrder][theirOrder] < 1;
  const docR = !countered ? doc : Object.assign({}, doc, {
    mult: Object.assign({}, doc.mult, {[myOrder]: 1 + (doc.mult[myOrder] - 1) * 0.35})
  });
  const myEff = orderEffect(b.us.units, myOrder, b.terrain, b.us.morale, myCommit, docR)
                * COUNTER[myOrder][theirOrder];
  const theirEff = orderEffect(b.them.units, theirOrder, b.terrain, b.them.morale, theirCommit)
                   * COUNTER[theirOrder][myOrder];
  const total = Math.max(1, myEff + theirEff);

  const myPool   = strength(b.us.units)   * 0.085;
  const theirPool = strength(b.them.units) * 0.085;
  const myLossRaw    = myPool    * (theirEff/total) * 2 * ORDERS[myOrder].defence
                       * doc.defence[myOrder] * mods().casualty;
  const theirLossRaw = theirPool * (myEff/total)    * 2 * ORDERS[theirOrder].defence;

  const myLost    = applyLosses(b.us.units,   myLossRaw,    ORDERS[myOrder].losses);
  const theirLost = applyLosses(b.them.units, theirLossRaw, ORDERS[theirOrder].losses);

  const myBefore = strength(b.us.units) + myLost, theirBefore = strength(b.them.units) + theirLost;
  b.us.morale   = clamp(b.us.morale   - (myLost/Math.max(1,myBefore))*100*0.80
                        + (theirLost/Math.max(1,theirBefore))*100*0.35
                        + ORDERS[myOrder].moraleSelf, 0, 100);
  b.them.morale = clamp(b.them.morale - (theirLost/Math.max(1,theirBefore))*100*0.80
                        + (myLost/Math.max(1,myBefore))*100*0.35
                        + ORDERS[theirOrder].moraleSelf, 0, 100);

  const rec = { round:b.round, myOrder, theirOrder, myLost, theirLost,
                myMorale:b.us.morale, theirMorale:b.them.morale };
  b.log.push(rec);
  b.round++;

  if(b.them.morale <= 20 || strength(b.them.units) < 8) b.over = "won";
  else if(b.us.morale <= 20 || strength(b.us.units) < 8) b.over = "lost";
  else if(b.round > b.maxRounds){
    const gap = b.us.morale - b.them.morale;
    b.over = gap > 8 ? "won" : gap < -8 ? "lost" : "draw";
  }
  return rec;
}
/* Auto-resolve: the same resolveRound, driven by a simple counter-picking
   heuristic. Not a shortcut past the model — a policy over it. */
function autoOrder(b){
  const doc = battleDoctrine();
  const avail = availableOrders(b.us.units, b.terrain, b, doc);
  if(!avail.length) return "refuse";
  const theirAvail = availableOrders(b.them.units, b.terrain, b);
  if(!theirAvail.length) theirAvail.push("refuse");
  const adaptive = b.them.profile === "condottiere";
  /* Predict their actual reply rather than a hopeful one. A condottiere
     counters the order you gave LAST round — which you know, so you can
     work out what is coming. Everyone else runs to type. */
  let predicted;
  const theirEffOf = id => orderEffect(b.them.units, id, b.terrain, b.them.morale, false);
  if(adaptive && b.log.length){
    const last = b.log[b.log.length-1].myOrder;
    predicted = theirAvail.reduce((acc, id) =>
      theirEffOf(id) * COUNTER[id][last] > theirEffOf(acc) * COUNTER[acc][last] ? id : acc, theirAvail[0]);
  } else {
    predicted = PROFILES[b.them.profile].prefer.find(id => theirAvail.includes(id)) || theirAvail[0];
  }
  let best = avail[0], bestScore = -Infinity;
  avail.forEach(id => {
    const mine = orderEffect(b.us.units, id, b.terrain, b.us.morale, false, doc);
    const score = mine * COUNTER[id][predicted] - theirEffOf(predicted) * COUNTER[predicted][id]
                  - ORDERS[id].defence * strength(b.us.units) * 0.35;
    if(score > bestScore){ bestScore = score; best = id; }
  });
  // bleeding badly and losing: get out with a company rather than a field
  if(b.us.morale < 34 && b.us.morale < b.them.morale - 12) return "refuse";
  return best;
}
function autoResolve(b){
  let guard = 0;
  while(!b.over && guard < 12){ guard++; resolveRound(b, autoOrder(b)); }
  if(!b.over){
    const gap = b.us.morale - b.them.morale;
    b.over = gap > 8 ? "won" : gap < -8 ? "lost" : "draw";
  }
  return b.over;
}
/* Casualties are held on the battle object until it ends, then written back
   to the company once. One transfer, one place. */
function commitBattle(b){
  UNIT_IDS.forEach(k => { S.units[k] = Math.max(0, b.us.units[k]); });
  const lost = b.log.reduce((a,r) => a + r.myLost, 0);
  if(lost > 0.10 * (strength() + lost)) hurtLieutenants(0.8); else hurtLieutenants(0.35);
  return lost;
}

/* ------------------------------------------------------------ sieges - */
const SIEGE_OPTS = {
  starve:{id:"starve", name:"Circumvallate and starve",
    line:"Ring the place, cut the roads, and wait. Cheap in men, dear in time."},
  sap:{id:"sap", name:"Mine and sap", cost:400,
    line:"Dig under the wall and bring a span of it down. Costs money and a season."},
  assault:{id:"assault", name:"Assault the breach",
    line:"Storm it now, through whatever gap there is. Fast and bloody."},
  bribe:{id:"bribe", name:"Treat with the garrison",
    line:"Every garrison has a price. Theirs is high, and it is not a secret afterwards."},
  abandon:{id:"abandon", name:"Raise the siege",
    line:"Walk away. Your employer will hear about it."}
};
function newSiege(town, faction){
  return { town, faction, walls: Math.round(rand(55,85)), garrison: Math.round(rand(120,300)),
           supplies: Math.round(rand(6,11)), relief: 0, seasons: 0, over:null };
}
function bribeCost(sg){ return Math.round(sg.garrison * 14 * (1 - 0.04*(S.attrs.cunning - ATTR_BASE))); }
function siegeAvailable(id, sg){
  if(id === "assault") return sg.walls < 40;
  if(id === "sap") return S.treasury >= SIEGE_OPTS.sap.cost;
  if(id === "bribe") return S.treasury >= bribeCost(sg);
  return true;
}
function siegeWhy(id, sg){
  if(id === "assault") return `The wall is still standing — ${Math.round(sg.walls)} of it. Bring it down before you storm it.`;
  if(id === "sap") return `Needs ${fmt(SIEGE_OPTS.sap.cost)} fl. for timber, powder and men who dig.`;
  if(id === "bribe") return `Their price is ${fmt(bribeCost(sg))} fl. You do not have it.`;
  return "";
}
/* One season of siege work. Returns a line of narration. */
function resolveSiege(sg, optId){
  const m = mods();
  sg.seasons++;
  let out = "";
  if(optId === "starve"){
    const eaten = rand(1.6, 3.0);
    sg.supplies -= eaten;
    coin(-rand(60,140), `lines around ${sg.town}`);
    sg.relief += rand(0.03, 0.07);
    out = `Another season in the lines at ${sg.town}. They are thinner inside than out.`;
  } else if(optId === "sap"){
    coin(-SIEGE_OPTS.sap.cost * m.sapCost, `mining the wall at ${sg.town}`);
    S.stat.saps++;
    const down = rand(22, 36) * m.sapWall;
    sg.walls = Math.max(0, sg.walls - down);
    sg.relief += rand(0.02, 0.05);
    out = `The mine went in under the north wall. ${Math.round(down)} feet of it is rubble.`;
  } else if(optId === "assault"){
    const odds = clamp(0.30 + (40 - sg.walls)/110 + S.quality*0.30 + m.assaultOdds, 0.15, 0.90);
    const cas = strength() * rand(0.07, 0.16) * m.casualty;
    applyLosses(S.units, cas, ORDERS.charge.losses);
    hurtLieutenants(1.3);
    if(Math.random() < odds){
      sg.over = "taken";
      out = `Into the breach at ${sg.town}, and through it. ${fmt(cas)} lances down to do it.`;
    } else {
      S.loyalty = clamp(S.loyalty - 6, 0, 100);
      out = `The assault on ${sg.town} was thrown back off the rubble. ${fmt(cas)} lances for nothing.`;
    }
  } else if(optId === "bribe"){
    const c = bribeCost(sg);
    coin(-c, `the garrison of ${sg.town}`);
    if(Math.random() < clamp(0.45 + 0.05*(S.attrs.cunning - ATTR_BASE), 0.2, 0.85)){
      sg.over = "taken";
      S.honor = clamp(S.honor - 5, 0, 100);
      out = `The gate of ${sg.town} was open at dawn and nobody will say who opened it.`;
    } else {
      S.honor = clamp(S.honor - 3, 0, 100);
      out = `They took the money at ${sg.town} and the gate stayed shut. That is the risk of it.`;
    }
  } else if(optId === "abandon"){
    sg.over = "abandoned";
    out = `You raised the siege of ${sg.town} and marched away.`;
  }

  if(!sg.over && sg.supplies <= 0){
    sg.over = "taken";
    out += ` They came out under a white flag before the week was done.`;
  }
  if(!sg.over && Math.random() < sg.relief){
    sg.over = "relief";
    out += ` A relief column is on the road.`;
  }
  return out;
}

/* --------------------------------------------------------- campaigns -
   A condotta is either a season of garrison work or a real campaign of
   two to four, with staged objectives. The best offer in the game tends to
   arrive while you are three seasons into somebody else's war. */
function campaignStages(n){
  const pool = ["march","battle","siege","battle"];
  const out = ["march"];
  while(out.length < n) out.push(pick(["battle","siege","march"]));
  return out.slice(0, n);
}
function breakCampaign(){
  const c = S.campaign; if(!c) return;
  const bc = mods().breakCost;
  rep(S, c.faction, -35 * bc);
  S.honor = clamp(S.honor - 10 * bc, 0, 100);
  post("bad", `You left ${facOf(c.faction).name} in the middle of a campaign. That will be remembered by more people than your employer.`);
  S.campaign = null; S.siege = null;
}

/* A rival with high renown pushes rates down — the same market, contested. */
function undercutFactor(){
  const top = S.rivals.reduce((m,r) => Math.max(m, r.renown), 0);
  if(S.flags.pact) return 1.04;         // a carve-up lifts everyone's rates
  return clamp(1 - (top/100) * 0.18, 0.82, 1);
}

function rollOffers(){
  S.offers = [];
  const m = mods();
  FACTIONS.forEach(f => {
    if(Math.random() < 0.42) return;
    const base = rand(6.0, 10.0);
    let pay = base * (1 + S.reputation[f.id]/200) * (1 + effDread()/300)
              * f.payBias * m.pay * undercutFactor();
    const isCampaign = Math.random() < 0.30;
    S.offers.push({
      faction: f.id,
      kind: isCampaign ? "campaign" : "short",
      seasons: isCampaign ? Math.round(rand(2, 4)) : 1,
      // A campaign pays better per season than garrison work, because it
      // asks you to be somewhere for a year and take a real field.
      payPerLance: Math.max(pay, 1.0),
      risk: rand(0.03, 0.09) * f.riskBias * m.risk
    });
  });
}

function hurtLieutenants(severity){
  liveLts().forEach(l => {
    if(Math.random() < severity * 0.10){
      l.alive = false;
      post("bad", `${ltName(l)} was killed.`);
      S.loyalty = clamp(S.loyalty - 4, 0, 100);
    }
  });
}

function resolveContract(offer){
  const f = facOf(offer.faction);
  const m = mods();
  const pay = offer.payPerLance * strength();
  const winChance = 0.4 + 0.4 * S.quality;
  S.underContract = f.id;
  let heavyLoss = false, income;

  if(Math.random() < winChance){
    const plunder = pay * rand(0.2, 0.6);
    const casualties = offer.risk * strength() * rand(0.3, 0.8) * m.casualty;
    const decisive = plunder > pay * 0.42;
    rep(S, f.id, rand(5,12) * f.loyaltyMemory);
    FACTIONS.forEach(o => { if(o.id !== f.id) S.reputation[o.id] -= rand(0,3); });
    S.honor = clamp(S.honor + 2, 0, 100);
    applyLosses(S.units, casualties, ORDERS.hold.losses);
    income = pay + plunder;
    coin(income, `condotta — ${f.short}`);
    post("good", flavor(decisive ? "winBig" : "winNarrow", {fac:f.name}));
    post("", `${fmt(pay)} in pay, ${fmt(plunder)} in plunder, ${fmt(casualties)} lances lost.`);
    hurtLieutenants(0.4);
    S.stat.wonBattles++;
  } else {
    const casualties = offer.risk * strength() * rand(1.0, 2.2) * m.casualty;
    heavyLoss = casualties > 0.10 * strength();
    S.reputation[f.id] -= rand(3,8);
    applyLosses(S.units, casualties, ORDERS.refuse.losses);
    income = pay * 0.5;
    coin(income, `condotta — ${f.short} (bad campaign)`);
    post("bad", flavor(heavyLoss ? "lossBad" : "lossNarrow", {fac:f.name}));
    post("", `Half wage only — ${fmt(income)}. ${fmt(casualties)} lances lost.`);
    hurtLieutenants(1.1);
    S.stat.lostBattles++;
  }
  S.stat.contracts++;
  return {heavyLoss, gotPlunder: income > pay};
}

function resolveRaid(){
  const m = mods();
  const target = pick(FACTIONS.filter(f => f.id !== S.underContract));
  const town = pick(TOWNS);
  const take = rand(500, 1400) * (1 + strength()/400) * m.take;
  coin(take, `composizione — ${town}`);
  S.dread = clamp(S.dread + rand(10,18), 0, 100);
  S.honor = clamp(S.honor - rand(6,14), 0, 100);
  S.reputation[target.id] = clamp(S.reputation[target.id] - rand(40,70), -100, 100);
  FACTIONS.forEach(f => { if(f.id !== target.id) S.reputation[f.id] -= rand(2,6); });
  S.underContract = null;
  const resisted = Math.random() < 0.15;
  post("gold", flavor(resisted ? "raidResisted" : "raidEasy", {town}));
  post("", `${fmt(take)} florins out of ${town}. ${target.name} will not forget it.`);
  if(resisted){
    const casualties = rand(0.02,0.06) * strength() * m.casualty;
    applyLosses(S.units, casualties, ORDERS.refuse.losses);
    hurtLieutenants(0.5);
  }
  S.stat.raids++;
  return {heavyLoss:false, gotPlunder:true};
}

function resolveRest(isWinter){
  const m = mods();
  S.loyalty = clamp(S.loyalty + m.restLoyalty, 0, 100);
  S.dread = clamp(S.dread - 3, 0, 100);
  S.underContract = null;
  const income = rand(20,80) * m.garrison;
  coin(income, "garrison fee");
  post("", flavor(isWinter ? "restWinter" : "restSummer"));
  return {heavyLoss:false, gotPlunder:false};
}

function payWages(){
  coin(-wageBill(), `wages, ${fmt(strength())} lances`);
  if(S.treasury >= 0){ S.negTreasuryStrikes = 0; return true; }
  S.negTreasuryStrikes++;
  return false;
}
function updateLoyalty(paid, heavyLoss, gotPlunder){
  const m = mods();
  if(paid) S.stat.cleanPay++; else S.stat.cleanPay = 0;
  if(paid && gotPlunder) S.loyalty = clamp(S.loyalty + 5, 0, 100);
  else if(paid) S.loyalty = clamp(S.loyalty + 1, 0, 100);
  else { S.loyalty = clamp(S.loyalty - m.wageLoyaltyHit, 0, 100); post("bad", flavor("wageShort")); }
  if(heavyLoss && !gotPlunder) S.loyalty = clamp(S.loyalty - 5, 0, 100);
  // The Articles are a floor, not a cure: they stop a slide, they do not lift.
  if(m.loyaltyFloor && S.loyalty < m.loyaltyFloor) S.loyalty = m.loyaltyFloor;
}
function recruit(){
  if(strength() >= maxLances()) return;
  const spare = S.treasury - CONFIG.recruitTreasuryBuffer;
  if(spare <= 0) return;
  const per = recruitCostPer();
  const hole = Math.max(0, startStrength() - strength());
  const cap = CONFIG.recruitRateCap + hole * 0.15;
  const got = Math.max(0, Math.min(cap, spare/per, maxLances()-strength()));
  if(got < 1) return;
  addRecruits(S.units, got);
  coin(-got * per, `recruitment, ${fmt(got)} lances`);
}
function applyForge(){
  if(!has("forge")) return;
  const ceiling = BUILDS.find(b=>b.id===S.build).quality + 0.10;
  if(S.quality < ceiling) S.quality = Math.min(ceiling, S.quality + 0.02);
}
/* Officers die and are not magically replaced, but a company that loses
   its corporals promotes from the ranks — without this the roster empties
   permanently over a 40-season run and the events stop having anyone to
   name. */
function promoteFromRanks(){
  if(liveLts().length >= 3) return;
  if(strength() < 40) return;
  if(Math.random() > 0.45) return;
  const l = makeLieutenant();
  l.loyalty = Math.round(rand(45, 70));
  S.lieutenants.push(l);
  post("", `${ltName(l)} was raised out of the ranks to corporal. He has the men behind him, which is most of it.`);
}

function driftRivals(){
  S.rivals.forEach(r => {
    r.renown = clamp(r.renown + rand(-4, 5), 0, 100);
    r.strength = Math.max(40, r.strength + rand(-12, 14));
  });
}
function checkCoalition(){
  const m = mods();
  const d = effDread();
  const threat = Math.max(0,(d-50)/50) * Math.max(0,(40-S.honor)/40);
  if(threat <= 0) return false;
  if(Math.random() < (0.03 + 0.20*threat) * m.coalition){
    const survive = Math.min(0.6, strength()/600 + S.quality*0.2);
    if(Math.random() > survive) return true;
    applyLosses(S.units, strength() * rand(0.25, 0.5));
    S.dread = clamp(S.dread - 20, 0, 100);
    hurtLieutenants(1.4);
    post("bad", "A league of your enemies came for you in the open and you barely held. The company is smaller for it.");
  }
  return false;
}
function checkWin(){
  if(S.turn < CONFIG.winEligibleFromSeason) return false;
  if(S.treasury < CONFIG.winTreasury) return false;
  return FACTIONS.some(f => S.reputation[f.id] >= CONFIG.winReputation);
}

function maybeIncident(){
  if(Math.random() > 0.30) return null;
  const pool = INCIDENTS.filter(i => { try{ return i.when(S); }catch(e){ return false; } });
  if(!pool.length) return null;
  const bag = [];
  pool.forEach(i => { for(let k=0;k<(i.weight||1);k++) bag.push(i); });
  return pick(bag);
}

function runSeason(action, offerIdx){
  const isWinter = (S.turn % CONFIG.seasonsPerYear) === WINTER_IDX;
  let result;
  if(action === "campaign") result = advanceCampaign();
  else if(action === "contract" && S.offers[offerIdx]){
    const offer = S.offers[offerIdx];
    if(offer.kind === "campaign"){ acceptCampaign(offer); result = advanceCampaign(); }
    else result = resolveContract(offer);
  }
  else if(action === "raid" && !isWinter) result = resolveRaid();
  else result = resolveRest(isWinter);
  if(result === "await"){
    /* A battle or a siege now owns the screen. It must be painted here:
       the season is suspended, so the tail that normally renders never
       runs, and the player would be left looking at the old view. */
    save(); render(); return;
  }
  finishSeason(result);
}

/* --------------------------------------------------- campaign machine - */
function acceptCampaign(offer){
  const f = facOf(offer.faction);
  S.campaign = {
    faction: offer.faction, payPerLance: offer.payPerLance, risk: offer.risk,
    stages: campaignStages(offer.seasons), done: 0, seasons: offer.seasons
  };
  S.underContract = offer.faction;
  post("gold", `Sealed with ${f.name}: ${offer.seasons} seasons in the field, and their war is now your war.`);
}
function completeCampaign(){
  const c = S.campaign; if(!c) return;
  const f = facOf(c.faction);
  rep(S, c.faction, rand(5, 10) * f.loyaltyMemory);
  S.honor = clamp(S.honor + 6, 0, 100);
  post("gold", `The campaign for ${f.name} is finished, and finished properly. They know where to find you.`);
  S.campaign = null; S.siege = null;
}
/* One season of a campaign. Returns a normal season result, or "await"
   when a battle or a siege takes the screen. */
function scoutNext(c){
  const stage = c.stages[c.done];
  if(stage === "battle" && !c.nextTerrain){
    c.nextTerrain = pick(TERRAIN_IDS);
    c.nextProfile = pick(Object.keys(PROFILES));
  }
  if(stage !== "battle"){ c.nextTerrain = null; c.nextProfile = null; }
}
function advanceCampaign(){
  const c = S.campaign;
  if(!c) return resolveRest(false);
  const f = facOf(c.faction);
  scoutNext(c);
  const stage = c.stages[c.done] || "march";
  const pay = c.payPerLance * strength();
  coin(pay, `condotta — ${f.short} (season ${c.done+1} of ${c.seasons})`);

  if(stage === "battle"){
    S.battle = newBattle({kind:"campaign", terrain:c.nextTerrain, profile:c.nextProfile});
    c.nextTerrain = null; c.nextProfile = null;
    return "await";
  }
  if(stage === "siege"){
    if(!S.siege) S.siege = newSiege(pick(TOWNS), c.faction);
    return "await";
  }
  post("", `On the march for ${f.name}. ${fmt(pay)} florins for a season of bad roads.`);
  if(Math.random() < 0.4) post("", flavor("camp"));
  c.done++;
  if(c.done >= c.stages.length) completeCampaign();
  /* A season of marching is paid, but it is not plunder, and the men can
     tell the difference. Wages alone hold a company together slowly. */
  return {heavyLoss:false, gotPlunder:false};
}
/* A battle has ended. Commit its casualties, pay out, move the campaign on,
   and hand back to the ordinary season tail. */
function endBattle(){
  const b = S.battle; if(!b) return;
  const lost = commitBattle(b);
  const c = S.campaign;
  const f = c ? facOf(c.faction) : null;
  let result = {heavyLoss: lost > 0.10 * (strength() + lost), gotPlunder:false};

  if(b.over === "won"){
    const won = b.log.length ? b.log[b.log.length-1].myOrder : null;
    if(won && S.stat.wonByOrder[won] !== undefined) S.stat.wonByOrder[won]++;
    const plunder = (c ? c.payPerLance * strength() : 400) * rand(0.10, 0.30) * mods().plunder;
    coin(plunder, "the field, and what was on it");
    if(f) rep(S, c.faction, rand(1,3) * f.loyaltyMemory);
    S.honor = clamp(S.honor + 3, 0, 100);
    S.dread = clamp(S.dread + rand(2,6), 0, 100);
    post("good", `${TERRAIN[b.terrain].name}: the field is yours. ${fmt(lost)} lances lost, ${fmt(plunder)} taken off it.`);
    result.gotPlunder = true;
  } else if(b.over === "draw"){
    post("", `${TERRAIN[b.terrain].name}: neither side would leave and neither could stay. ${fmt(lost)} lances for nothing anyone could name.`);
  } else {
    if(f) S.reputation[c.faction] -= rand(6, 14);
    if(c) coin(-c.payPerLance * strength() * 0.55, `pay withheld after the field`);
    S.loyalty = clamp(S.loyalty - 3, 0, 100);
    post("bad", `${TERRAIN[b.terrain].name}: you lost the field. ${fmt(lost)} lances, and the road back.`);
  }
  S.battle = null;
  if(c){ c.done++; if(c.done >= c.stages.length) completeCampaign(); }
  finishSeason(result);
}
/* One season of siege work, then either continue or resolve. */
function siegeAction(optId){
  const sg = S.siege; if(!sg) return;
  if(S.campaign){
    const f = facOf(S.campaign.faction);
    coin(S.campaign.payPerLance * strength() * 0.55, `condotta — ${f.short} (before ${sg.town})`);
  }
  const line = resolveSiege(sg, optId);
  post(sg.over === "taken" ? "gold" : sg.over ? "bad" : "", line);
  let result = {heavyLoss:false, gotPlunder:false};

  if(sg.over === "relief"){
    S.battle = newBattle({kind:"relief", ratio: rand(0.8, 1.2)});
    S.siege = null;
    render(); return;
  }
  if(sg.over === "taken"){
    const c = S.campaign, f = c ? facOf(c.faction) : null;
    S.stat.townsTaken++;
    const plunder = rand(280, 820) * (1 + strength()/400) * mods().plunder;
    coin(plunder, `the sack of ${sg.town}`);
    S.dread = clamp(S.dread + rand(6,12), 0, 100);
    if(f) rep(S, c.faction, rand(2,5) * f.loyaltyMemory);
    post("gold", `${sg.town} is taken. ${fmt(plunder)} florins out of it, and your name carried further than the money.`);
    result.gotPlunder = true;
    S.siege = null;
    if(c){ c.done++; if(c.done >= c.stages.length) completeCampaign(); }
  } else if(sg.over === "abandoned"){
    const c = S.campaign;
    if(c){ rep(S, c.faction, -18); S.honor = clamp(S.honor - 4, 0, 100); }
    S.siege = null;
    if(c){ c.done++; if(c.done >= c.stages.length) completeCampaign(); }
  }
  finishSeason(result);
}

/* Everything after the season's action resolves. Split out so a battle or
   a siege can suspend the season, take over the screen, and hand back to
   exactly the same tail — rather than a second copy of it that drifts. */
function finishSeason(result){
  FACTIONS.forEach(f => { S.reputation[f.id] *= CONFIG.repDecay; });
  S.dread *= CONFIG.dreadDecay;

  const paid = payWages();
  updateLoyalty(paid, result.heavyLoss, result.gotPlunder);
  recruit();
  applyForge();
  promoteFromRanks();
  driftRivals();
  if(Math.random() < 0.18) post("", flavor("camp"));

  S.stat.seasons++;
  S.turn++;

  if(S.loyalty <= 0){
    const l = liveLts()[0];
    S.over = {result:"mutiny", text: l
      ? `${ltName(l)} put it to a vote in the night. By morning the company is three companies, and none of them is yours.`
      : "The corporals put it to a vote in the night. By morning the company is three companies, and none of them is yours."};
  } else if(S.negTreasuryStrikes >= CONFIG.mutinyTreasuryStrikes && S.loyalty < CONFIG.mutinyLoyaltyCeilingForStrikes){
    S.over = {result:"mutiny", text:"Two seasons unpaid, and trust already thin. The company does not survive a third."};
  } else if(checkCoalition()){
    const r = S.rivals[0];
    S.over = {result:"coalition", text: r
      ? `Every town you ever rode past for tribute has finally agreed on one thing, and they have given ${r.name} the command of it. What is left of the company does not leave the field.`
      : "Every town you ever rode past for tribute has finally agreed on one thing. What is left of the company does not leave the field."};
  } else if(checkWin()){
    const t = FACTIONS.find(f => S.reputation[f.id] >= CONFIG.winReputation);
    S.over = {result:"won", text:`${t.name} has offered you what no free company keeps forever: a permanent commission, a house, and a name that does not have to be feared to be paid. You take it.`};
  } else if(S.turn >= CONFIG.totalSeasons){
    S.over = {result:"retired", text:"You have outlasted most captains who ever rode this road. Old age takes you before the coalition or the creditors do — a quieter ending than most, and not a small one."};
  }

  if(!S.over){
    rollOffers();
    pendingIncident = maybeIncident();
  } else { S.offers = []; pendingIncident = null; S.battle = null; S.siege = null; }
  save();
  render();
  if(pendingIncident) openSheet(sheetIncident);
}

/* -------------------------------------------------------------- views - */
function chipsHTML(){
  const rows = [
    ["Treasury", `${fmt(S.treasury)} fl.`, S.treasury < 0],
    ["Strength", fmt(strength()), strength() < startStrength()*0.3],
    ["Loyalty", fmt(S.loyalty), S.loyalty < 25],
    ["Dread", fmt(effDread()), false],
    ["Honor", fmt(S.honor), S.honor < 20],
    ["Quality", `${Math.round(S.quality*100)}%`, false]
  ];
  return rows.map(([k,v,warn]) =>
    `<div class="chip"><span class="k">${k}</span><span class="v${warn?" neg":""}">${v}</span></div>`).join("");
}
const NAV = [["field","Field"],["company","Company"],["captain","Captain"],["world","World"],["account","Account"]];
function navHTML(){
  return NAV.map(([id,label]) => {
    let badge = "";
    if(id === "company" && affordableInvestments().length) badge = `<span class="badge">${affordableInvestments().length}</span>`;
    return `<button data-a="go" data-v="${id}"${S.tab===id?' aria-current="page"':""}>${label}${badge}</button>`;
  }).join("");
}
function affordableInvestments(){
  return INVESTMENTS.filter(i => !has(i.id) && S.treasury >= i.cost);
}

function viewField(){
  const isWinter = (S.turn % CONFIG.seasonsPerYear) === WINTER_IDX;
  let h = tutorialHTML("field");

  /* Under contract for a campaign: that is the season's work, and the only
     other choice is to walk away from it. */
  if(S.campaign){
    const c = S.campaign, f = facOf(c.faction);
    const stage = c.stages[c.done] || "march";
    const names = {march:"On the march", battle:"A field to be fought", siege:"A town to be taken"};
    const md = mods();
    let scouted = "";
    if(stage === "battle" && c.nextTerrain){
      if(md.scoutGround) scouted += ` Your outriders report ${TERRAIN[c.nextTerrain].name.toLowerCase()}.`;
      if(md.scoutFoe && c.nextProfile) scouted += ` You are facing ${PROFILES[c.nextProfile].name}.`;
    }
    h += `<div class="camp-strip"><span class="main">
      <span class="t">${f.name} &mdash; season ${c.done+1} of ${c.seasons}</span>
      <span class="s">${names[stage]}. ${fmt(Math.round(c.payPerLance*strength()))} fl. the season.${scouted}</span></span></div>`;
    h += `<section class="sec"><div class="btnrow">
      <button class="btn primary" data-a="campaign">${stage === "march" ? "March on" : stage === "battle" ? "Take the field" : "Sit down before the walls"}</button>
      <button class="btn ghost" data-a="breakcamp">Break the contract</button>
    </div>
    <p class="lede">Breaking it costs you badly with ${f.name}, and with everyone who hears of it.</p></section>`;
    h += `<section class="sec"><h2>The account</h2><div class="panel">${journalHTML(8)}</div></section>`;
    return h;
  }

  if(isWinter){
    h += `<section class="sec"><h2>Winter quarters</h2>
      <p class="lede">No campaigning in winter. The passes are shut and the country has nothing left to give.
      ${has("quarters") ? "Your own quarters will have you back." : "You will sit where you are."}</p></section>`;
  } else {
    h += `<section class="sec"><h2>This season's offers</h2>`;
    if(!S.offers.length){
      h += `<div class="empty">No one is hiring this season. Every city is either at peace or out of money.
        Ride for tribute, or rest and wait for a war.</div>`;
    } else {
      const uc = undercutFactor();
      h += S.offers.map((o,i) => {
        const f = facOf(o.faction);
        const pay = Math.round(o.payPerLance * strength());
        const top = S.rivals.slice().sort((a,b)=>b.renown-a.renown)[0];
        const camp = o.kind === "campaign";
        return `<button class="offer" data-a="contract" data-v="${i}">
          <span class="pay">${fmt(pay)} fl.${camp ? "<br><small style=\"color:var(--dim)\">a season</small>" : ""}</span>
          <span class="t">${f.name}${camp ? ` &mdash; ${o.seasons} seasons` : ""}</span>
          <span class="s">${camp
            ? `A campaign. Marches, a field or two, and likely a town to sit down before. Risk: ${Math.round(o.risk*100)}%.`
            : `Garrison and escort work for the season. Risk of the field: ${Math.round(o.risk*100)}%.`}</span>
        </button>`;
      }).join("");
      const top = S.rivals.slice().sort((a,b)=>b.renown-a.renown)[0];
      if(undercutFactor() < 0.97 && top)
        h += `<p class="lede" style="color:var(--blood)">${esc(top.name)} is underbidding you across the country — every rate here is down.</p>`;
    }
    h += `</section>`;
  }
  h += `<section class="sec"><div class="btnrow">
      ${isWinter ? "" : `<button class="btn ghost" data-a="raid">Ride for composizione</button>`}
      <button class="btn${isWinter?" primary":""}" data-a="rest">${isWinter?"Winter in place":"Rest this season"}</button>
    </div></section>`;
  h += `<section class="sec"><h2>The account</h2><div class="panel">${journalHTML(8)}</div></section>`;
  return h;
}

function viewCompany(){
  let h = tutorialHTML("company")
    + hint("company", "Lieutenants are named men: they lead, they die, and one of them leads the mutiny if it comes. Investments are permanent, and matter more than raw numbers.");
  h += `<section class="sec"><h2>Your lieutenants</h2>`;
  const live = liveLts();
  if(!live.length){
    h += `<div class="empty">You have no lieutenants left alive. Nobody speaks for the men but you,
      and that is worse than it sounds.</div>`;
  } else {
    h += live.map(l => {
      const t = TRAITS.find(t => t.id === l.trait);
      return `<div class="row flat"><span class="main">
        <span class="t">${esc(ltName(l))}</span>
        <span class="s">${t ? esc(t.note) : ""}</span></span>
        <span class="end">skill ${l.skill}<br><span style="color:var(--dim)">loyal ${l.loyalty}</span></span></div>`;
    }).join("");
  }
  h += `</section>`;

  h += doctrineHTML();

  h += `<section class="sec"><h2>Investment in the company</h2>
    <p class="lede">Permanent. Bought with the same florins the road home needs, which is the whole difficulty.</p>`;
  h += INVESTMENTS.map(i => {
    const owned = has(i.id);
    const can = S.treasury >= i.cost;
    return `<button class="row${owned?" owned":""}" ${owned?'data-a="noop"':`data-a="invest" data-v="${i.id}"`}${!owned&&!can?" disabled":""}>
      <span class="main"><span class="t">${i.name}${owned?" — held":""}</span>
      <span class="s">${i.note} <em style="color:var(--dim)">${i.effect}</em></span></span>
      <span class="end">${owned ? "&#10003;" : `${fmt(i.cost)} fl.`}</span></button>`;
  }).join("");
  if(!affordableInvestments().length && S.investments.length < INVESTMENTS.length){
    h += `<div class="empty">Nothing you can afford this season. The cheapest is
      ${fmt(Math.min(...INVESTMENTS.filter(i=>!has(i.id)).map(i=>i.cost)))} fl.</div>`;
  }
  h += `</section>`;
  return h;
}

/* ---------------------------------------------------------- tutorial -
   Steps are predicates, not a script. The current step is simply the first
   one the player has not yet satisfied, so doing things out of order — or
   doing the next thing before being told to — can never strand anybody
   mid-sequence. Dismissible at any point, replayable from the menu. */
const TUTORIAL = [
  {id:"offer", view:"field",
   text:"Every season you take work, ride for tribute, or rest. Start with a contract — the faction, what it pays, and how dangerous the field is are all on the offer.",
   done:s => s.stat.contracts > 0 || s.campaign || s.stat.raids > 0},
  {id:"account", view:"field",
   text:"That was a season. What happened to your company is written in the account below, and in the Account tab in full.",
   done:s => s.stat.seasons >= 2},
  {id:"world", view:"field",
   text:"Open World. Each city remembers you separately, and the two numbers that decide your fate — Dread and Honor — are in the header. Dread gets you hired. Honor keeps the cities from banding together against you.",
   done:s => !!s.seen.tab_world},
  {id:"company", view:"field",
   text:"Open Company. Florins spent on a surgeon or a paymaster do more for a company than florins spent on more men.",
   done:s => !!s.seen.tab_company},
  {id:"doctrine", view:"company",
   text:"Below the investments: choose two things for the company to be known for. They are permanent, and each advances by proving you fight that way.",
   done:s => s.doctrine.picked.length > 0},
  {id:"win", view:"field",
   text:"To be taken off the road for good you need 11,000 florins AND one faction's regard at 60. Chasing the best rate every season is safer; committing to one employer is how you actually get there.",
   done:s => s.stat.seasons >= 6}
];
function tutorialStep(){
  if(!S.tutorial || S.tutorial.done) return null;
  for(const t of TUTORIAL){ if(!t.done(S)) return t; }
  return null;
}
function tutorialHTML(view){
  const t = tutorialStep();
  if(!t || t.view !== view) return "";
  return `<div class="tut"><span class="main">${t.text}</span>
    <button class="btn ghost sm" data-a="tut-off">Stop</button></div>`;
}
/* One dismissible line the first time a screen is opened. */
function hint(key, text){
  if(S.seen[key]) return "";
  return `<div class="hint"><span class="main">${text}</span>
    <button class="btn ghost sm" data-a="hint-seen" data-v="${key}">Got it</button></div>`;
}
const INTRO = [
  {h:"A free company", p:"Italy, 1360s. You are the captain of a few hundred men who fight for whoever pays. There is no state, no flag, and no pension — only the next contract."},
  {h:"One season, one choice", p:"Four seasons to a year, ten years to a career. Each season you take a condotta, ride to a town and demand money not to burn it, or rest and let the company mend. Wages come due either way."},
  {h:"Two names, pulling apart", p:"Dread is what gets you hired at a good rate. Honor is what stops the cities agreeing to destroy you. Every raid buys the first and spends the second. That tension is the whole game."},
  {h:"Getting off the road", p:"Bank 11,000 florins and earn one faction's regard to 60, and you are offered a permanent commission — the thing no free company keeps forever. Lose your men's loyalty, or your creditors, and there is no company left to offer it to."}
];
function sheetIntro(){
  const i = S.tutorial.step || 0;
  const pg = INTRO[i];
  return `<h3>${pg.h}</h3><p class="lede">${pg.p}</p>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ghost" data-a="tut-skip">Skip all this</button>
      <button class="btn primary" data-a="tut-next">${i >= INTRO.length-1 ? "Take the road" : "Next"}</button>
    </div>
    <p class="lede" style="text-align:center;margin-top:10px;color:var(--dim)">${i+1} of ${INTRO.length}</p>`;
}

/* Doctrine: two picks out of eight, three steps each, bought with florins
   and with proof that the company actually fights that way. */
function doctrineReady(d){
  const t = docTier(d.id);
  if(t >= DOCTRINE_MAX) return false;
  return d.proof(S) >= d.need[t];
}
function doctrineHTML(){
  const picked = S.doctrine.picked;
  let h = `<section class="sec"><h2>What the company is known for</h2>`;
  if(!picked.length){
    h += `<p class="lede">Choose two. They are what the company trains at, and they
      cannot be unchosen — a company is known for one thing or two, never eight.</p>`;
  } else if(picked.length < DOCTRINE_PICKS){
    h += `<p class="lede">One more to choose, and then the company is what it is.</p>`;
  }

  const list = picked.length >= DOCTRINE_PICKS ? picked.map(docDef) : DOCTRINES;
  h += list.map(d => {
    const t = docTier(d.id), taken = docPicked(d.id);
    const pips = `${"&#9679;".repeat(t)}${"&#9675;".repeat(DOCTRINE_MAX - t)}`;
    if(!taken){
      const room = picked.length < DOCTRINE_PICKS;
      return `<button class="row" data-a="dpick" data-v="${d.id}"${room?"":" disabled"}>
        <span class="main"><span class="t">${d.name}</span>
        <span class="s">${d.note}</span></span>
        <span class="end" style="color:var(--dim)">${room ? "take" : "&mdash;"}</span></button>`;
    }
    const maxed = t >= DOCTRINE_MAX;
    const cost = maxed ? 0 : DOCTRINE_COST[t];
    const have = d.proof(S), want = maxed ? 0 : d.need[t];
    const proofOk = have >= want, coinOk = S.treasury >= cost;
    let why = "";
    if(maxed) why = `<em style="color:var(--gold-hi)">Nothing further to learn.</em>`;
    else if(!proofOk) why = `<em style="color:var(--dim)">Needs ${want} ${d.proofLabel} &mdash; you have ${have}.</em>`;
    else if(!coinOk) why = `<em style="color:var(--dim)">Needs ${fmt(cost)} fl.</em>`;
    else why = `<em style="color:var(--green)">Ready &mdash; ${fmt(cost)} fl.</em>`;
    return `<button class="row owned" ${maxed||!proofOk||!coinOk?'data-a="noop"':`data-a="dstep" data-v="${d.id}"`}${maxed||!proofOk||!coinOk?" disabled":""}>
      <span class="main"><span class="t">${d.name} <span class="pips" style="color:var(--gold-hi)">${pips}</span></span>
      <span class="s">${t > 0 ? d.steps[t-1] : d.note}<br>${why}</span></span></button>`;
  }).join("");
  h += `</section>`;
  return h;
}

function viewCaptain(){
  const m = mods();
  let h = hint("captain", "Attributes and finery nudge the numbers and shape how events read. The figures at the bottom are the same ones the season is resolved with.");
  h += `<section class="sec"><h2>${esc(S.captainName)}</h2>
    <div class="bigbanner">${bannerHTML("capBanner", S.banner, 4)}</div>
    <div class="btnrow"><button class="btn ghost sm" data-a="bannersheet">Change the banner</button></div></section>`;

  h += `<section class="sec"><h2>Attributes</h2><div class="panel">`;
  h += ATTRS.map(a => `<div class="attr"><span class="an">${a.name}<small>${a.note}</small></span>
    <span class="pips">${"&#9679;".repeat(S.attrs[a.id])}${"&#9675;".repeat(ATTR_MAX - S.attrs[a.id])}</span></div>`).join("");
  h += `</div></section>`;

  h += `<section class="sec"><h2>Arms and finery</h2>
    <p class="lede">What you wear is mostly who you are. It moves the numbers a little; it moves how you are spoken of a great deal.</p>`;
  ["armour","horse","blade","wardrobe"].forEach(slot => {
    const cur = kitOf(slot);
    h += `<div class="row flat"><span class="main"><span class="t">${cur.name}</span>
      <span class="s">${cur.note}</span></span>
      <span class="end"><button class="btn ghost sm" data-a="kitsheet" data-v="${slot}">Change</button></span></div>`;
  });
  h += `</section>`;

  h += `<section class="sec"><h2>What it all adds up to</h2><div class="panel">
    <div class="kv"><span class="k">Road</span><span class="v">${DIFFICULTY[S.difficulty].name}</span></div>
    <div class="kv"><span class="k">Terms offered</span><span class="v">&times;${m.pay.toFixed(2)}</span></div>
    <div class="kv"><span class="k">Losses taken</span><span class="v">&times;${m.casualty.toFixed(2)}</span></div>
    <div class="kv"><span class="k">Tribute taken</span><span class="v">&times;${m.take.toFixed(2)}</span></div>
    <div class="kv"><span class="k">Reputation earned</span><span class="v">&times;${m.repGain.toFixed(2)}</span></div>
    <div class="kv"><span class="k">Dread from finery</span><span class="v">+${m.dread}</span></div>
    </div>
    <p class="lede">These are the same figures the season is resolved with — not a separate estimate.</p></section>`;
  return h;
}

function viewWorld(){
  let h = hint("world", "Each city keeps its own account of you. Florence forgets nothing; Milan pays best and breaks faith first; Pisa cannot afford you. Committing to the right one is how a run is won.");
  h += `<section class="sec"><h2>Standing with the powers</h2><div class="panel">`;
  h += FACTIONS.map(f => {
    const v = S.reputation[f.id];
    const pct = clamp((v+100)/2, 0, 100);
    const col = v < 0 ? "var(--blood)" : "var(--gold)";
    return `<div class="facnote"><div class="repline"><span class="f">${f.name}</span>
      <span class="bar"><i style="left:${v<0?pct:50}%;width:${Math.abs(pct-50)}%;background:${col}"></i></span>
      <span class="n ${v<0?"neg":v>20?"pos":""}">${Math.round(v)}</span></div>
      ${f.note}</div>`;
  }).join("");
  h += `</div></section>`;

  h += `<section class="sec"><h2>Other companies on the road</h2>`;
  if(!S.rivals.length){
    h += `<div class="empty">No other free company of note is working this country. That will not last.</div>`;
  } else {
    h += S.rivals.slice().sort((a,b)=>b.renown-a.renown).map(r =>
      `<div class="row flat">${bannerHTML("riv_"+esc(r.seed), r.seed, 2, "rivbanner")}
      <span class="main"><span class="t">${esc(r.name)}</span>
      <span class="s">${esc(r.company)} — about ${fmt(r.strength)} lances</span></span>
      <span class="end">renown<br>${Math.round(r.renown)}</span></div>`).join("");
    if(undercutFactor() < 0.97){
      h += `<p class="lede">Their reputation is pushing rates down across the country. Yours included.</p>`;
    }
  }
  h += `</section>`;
  return h;
}

function journalHTML(limit){
  if(!S.journal.length) return `<div class="empty">Nothing written yet. The account starts when the first season does.</div>`;
  const rows = S.journal.slice(0, limit||30)
    .sort((a,b) => (b.turn - a.turn) || ((a.seq||0) - (b.seq||0)));
  return `<div class="journal">${rows.map(j =>
    `<div class="jrow ${j.kind}"><span class="w">${seasonOf(j.turn)} ${yearOf(j.turn)}</span>${esc(j.text)}</div>`).join("")}</div>`;
}
function viewAccount(){
  const recent = S.ledger.slice(-14).reverse();
  let h = hint("account", "Everything that happened to the company, in order, with the money underneath it.");
  h += `<section class="sec"><h2>The company's account</h2><div class="panel">${journalHTML(30)}</div></section>`;
  h += `<section class="sec"><h2>The ledger</h2>`;
  if(!recent.length) h += `<div class="empty">No entries yet.</div>`;
  else h += `<div class="panel">${recent.map(r =>
    `<div class="kv"><span class="k">${esc(r.item)}</span>
     <span class="v ${r.in?"pos":"neg"}">${r.in?"+":"&minus;"}${fmt(r.in||r.out)}</span></div>`).join("")}</div>`;
  h += `</section>`;
  return h;
}

/* ------------------------------------------------------ battle view - */
function viewBattle(){
  const b = S.battle, t = TERRAIN[b.terrain];
  const avail = availableOrders(b.us.units, b.terrain, b, battleDoctrine());
  const p = PROFILES[b.them.profile];
  let h = hint("battle", "Volley beats a braced line; a charge beats archers; a braced line stops a charge. The ground shifts which of those is true. Refusing the flank never wins, but it keeps the company.");
  h += `<section class="sec"><h2>${t.name}</h2>
    <p class="lede">${t.note} Against ${p.name} — ${p.note.toLowerCase()}</p>
    <div class="bfwrap">${battleCanvasHTML("bfield")}</div>
    <div class="panel" style="margin-top:10px">
      <div class="kv"><span class="k">Round</span><span class="v">${Math.min(b.round,b.maxRounds)} of ${b.maxRounds}</span></div>
      <div class="kv"><span class="k">Your strength &middot; heart</span><span class="v">${fmt(strength(b.us.units))} &middot; ${Math.round(b.us.morale)}</span></div>
      <div class="kv"><span class="k">Theirs</span><span class="v">${fmt(strength(b.them.units))} &middot; ${Math.round(b.them.morale)}</span></div>
    </div></section>`;

  if(b.log.length){
    const r = b.log[b.log.length-1];
    h += `<section class="sec"><div class="panel"><p class="lede" style="margin:0">
      Last round you ${ORDERS[r.myOrder].verb}; they ${ORDERS[r.theirOrder].verb}.
      You lost ${fmt(r.myLost)}, they lost ${fmt(r.theirLost)}.</p></div></section>`;
  }

  h += `<section class="sec"><h2>Your order</h2>`;
  h += ORDER_IDS.map(id => {
    const o = ORDERS[id], ok = avail.includes(id);
    const mult = TERRAIN[b.terrain][id];
    const ground = mult >= 1.15 ? "good ground for it" : mult <= 0.9 ? "bad ground for it" : "fair ground";
    return `<button class="row" data-a="order" data-v="${id}"${ok?"":" disabled"}>
      <span class="main"><span class="t">${o.name}</span>
      <span class="s">${ok ? `${o.line} <em style="color:var(--dim)">${ground}.</em>` : o.why}</span></span></button>`;
  }).join("");
  h += `<div class="btnrow">
      <button class="btn ghost" data-a="reserve"${b.reserveUsed?" disabled":""}>${b.reserveUsed?"Reserve spent":"Commit the reserve"}</button>
      <button class="btn ghost" data-a="autobattle">Let them handle it</button>
    </div></section>`;
  return h;
}

/* ------------------------------------------------------- siege view - */
function viewSiege(){
  const sg = S.siege;
  let h = `<section class="sec"><h2>The siege of ${esc(sg.town)}</h2>
    <p class="lede">Season ${sg.seasons+1} before the walls.</p>
    <div class="panel">
      <div class="kv"><span class="k">Walls</span><span class="v">${Math.round(sg.walls)}</span></div>
      <div class="kv"><span class="k">Garrison</span><span class="v">${fmt(sg.garrison)}</span></div>
      <div class="kv"><span class="k">Their stores</span><span class="v">${sg.supplies > 0 ? Math.max(1,Math.round(sg.supplies)) + " seasons" : "gone"}</span></div>
      <div class="kv"><span class="k">Word of a relief column</span><span class="v">${Math.round(sg.relief*100)}%</span></div>
    </div></section>`;
  h += `<section class="sec"><h2>How you take it</h2>`;
  h += Object.keys(SIEGE_OPTS).map(id => {
    const o = SIEGE_OPTS[id], ok = siegeAvailable(id, sg);
    const price = id === "sap" ? ` &middot; ${fmt(o.cost)} fl.` : id === "bribe" ? ` &middot; ${fmt(bribeCost(sg))} fl.` : "";
    return `<button class="row" data-a="siege" data-v="${id}"${ok?"":" disabled"}>
      <span class="main"><span class="t">${o.name}${price}</span>
      <span class="s">${ok ? o.line : siegeWhy(id, sg)}</span></span></button>`;
  }).join("");
  h += `</section>`;
  return h;
}

function render(){
  const app = $("#app");
  if(!S){ app.innerHTML = viewTitle(); paintBanners(); return; }
  if(S.over){ app.innerHTML = viewOver(); paintBanners(); return; }
  if(S.battle){
    app.innerHTML = `<div id="hud"><div class="hud-top">
        ${bannerHTML("hudBanner", S.banner, 2, "hud-banner")}
        <div class="coname">A field near ${esc(pick(TOWNS))}<small>${TERRAIN[S.battle.terrain].name}</small></div>
        <div class="date"><b>${seasonOf(S.turn)}</b>${yearOf(S.turn)}</div>
      </div></div><main>${viewBattle()}</main>`;
    paintBanners(); paintBattle(); return;
  }
  if(S.siege){
    app.innerHTML = `<div id="hud"><div class="hud-top">
        ${bannerHTML("hudBanner", S.banner, 2, "hud-banner")}
        <div class="coname">Before ${esc(S.siege.town)}<small>Captain ${esc(S.captainName)}</small></div>
        <div class="date"><b>${seasonOf(S.turn)}</b>${yearOf(S.turn)}</div>
      </div><div class="chips">${chipsHTML()}</div></div><main>${viewSiege()}</main>`;
    paintBanners(); return;
  }
  const body = S.tab === "company" ? viewCompany()
             : S.tab === "captain" ? viewCaptain()
             : S.tab === "world"   ? viewWorld()
             : S.tab === "account" ? viewAccount()
             : viewField();
  app.innerHTML = `
    <div id="hud">
      <div class="hud-top">
        ${bannerHTML("hudBanner", S.banner, 2, "hud-banner")}
        <div class="coname">${esc(S.companyName)}<small>Captain ${esc(S.captainName)}</small></div>
        <div class="date"><b>${seasonOf(S.turn)}</b>${yearOf(S.turn)}</div>
        <button id="menuBtn" data-a="menu">&#9776;</button>
      </div>
      <div class="chips">${chipsHTML()}</div>
      <div id="nav">${navHTML()}</div>
    </div>
    <main>${body}</main>`;
  paintBanners();
}

function viewTitle(){
  if(build){
    if(build.step === 1){
      return `<div class="title-wrap"><div class="step">Step 1 of 3 — the captain</div>
        <h1>The Company</h1>
        <input class="name" id="cname" placeholder="Your captain's name" maxlength="30" value="${esc(build.name||"")}">
        ${BUILDS.map(b => `<button class="build${build.pick===b.id?" sel":""}" data-a="pickbuild" data-v="${b.id}">
          <span class="t">${b.name}</span><span class="s">${b.blurb} &mdash; ${strength(b.units)} lances, ${fmt(b.treasury)} fl.</span></button>`).join("")}
        <div class="btnrow" style="margin-top:12px">
          <button class="btn ghost" data-a="titleback">Back</button>
          <button class="btn primary" data-a="step2">Next</button></div></div>`;
    }
    if(build.step === 2){
      const spent = ATTRS.reduce((a,x) => a + (build.attrs[x.id] - ATTR_BASE), 0);
      const left = ATTR_POINTS - spent;
      return `<div class="title-wrap"><div class="step">Step 2 of 3 — the man himself</div>
        <h1>${esc(build.name || "The Captain")}</h1>
        <p class="sub">${left} point${left===1?"":"s"} left to place. These nudge the numbers; they mostly decide who you are.</p>
        <div class="panel" style="text-align:left">
        ${ATTRS.map(a => `<div class="attr"><span class="an">${a.name}<small>${a.note}</small></span>
          <span class="pips">${"&#9679;".repeat(build.attrs[a.id])}${"&#9675;".repeat(ATTR_MAX-build.attrs[a.id])}</span>
          <span class="end" style="display:flex;gap:5px">
            <button class="btn ghost sm" data-a="attr-" data-v="${a.id}"${build.attrs[a.id]<=ATTR_BASE?" disabled":""}>&minus;</button>
            <button class="btn ghost sm" data-a="attr+" data-v="${a.id}"${left<=0||build.attrs[a.id]>=ATTR_MAX?" disabled":""}>+</button>
          </span></div>`).join("")}
        </div>
        <div class="btnrow" style="margin-top:12px">
          <button class="btn ghost" data-a="step1">Back</button>
          <button class="btn primary" data-a="step3">Next</button></div></div>`;
    }
    return `<div class="title-wrap"><div class="step">Step 3 of 3 — your banner</div>
      <h1>Arms</h1>
      <p class="sub">Choose a device, or roll for one. Your men will follow it; your enemies will learn it.</p>
      <div class="bigbanner">${bannerHTML("bigPick", build.banner, 4)}</div>
      <div class="btnrow" style="margin-bottom:10px">
        <button class="btn gold" data-a="rollbanner">Roll a new one</button></div>
      <div class="bannergrid">
        ${BANNER_PRESETS.slice(0,12).map(seed =>
          `<button class="bannerpick${build.banner===seed?" sel":""}" data-a="pickbanner" data-v="${seed}">
            ${bannerHTML("pre_"+seed, seed, 2)}</button>`).join("")}
      </div>
      <div class="panel" style="text-align:left;margin-bottom:10px">
        <div class="kv"><span class="k">Difficulty</span><span class="v">${DIFFICULTY[build.difficulty].name}</span></div>
        <div class="lede" style="margin:6px 0 8px">${DIFFICULTY[build.difficulty].note}</div>
        <div class="btnrow">${Object.keys(DIFFICULTY).map(k =>
          `<button class="btn ghost sm${build.difficulty===k?" gold":""}" data-a="pickdiff" data-v="${k}">${DIFFICULTY[k].name}</button>`).join("")}</div>
      </div>
      <div class="btnrow">
        <button class="btn ghost" data-a="step2">Back</button>
        <button class="btn primary" data-a="startgame">Take the road</button></div></div>`;
  }
  const hasSave = !!localStorage.getItem(CONFIG.saveKey);
  return `<div class="title-wrap">
    <h1>The Company</h1>
    <p class="sub">Italy, 1360s. Find work, hold your men together,<br>decide what your name is worth.</p>
    ${hasSave ? `<button class="btn primary" data-a="continue">Continue</button>` : ""}
    <button class="btn${hasSave?" ghost":" primary"}" data-a="newco">A new company</button>
    <button class="btn ghost" data-a="slots" data-v="load">Load a saved company</button></div>`;
}

function viewOver(){
  const titles = {won:"A commission for life", mutiny:"The company is no more",
    coalition:"Run to ground", retired:"The road behind you"};
  const good = S.over.result === "won" || S.over.result === "retired";
  return `<div class="over">
    <div class="bigbanner">${bannerHTML("overBanner", S.banner, 4)}</div>
    <h1 class="${good?"":"neg"}">${titles[S.over.result]}</h1>
    <p>${esc(S.over.text)}</p>
    <p class="lede">${fmt(S.stat.seasons)} seasons on the road. ${fmt(S.stat.contracts)} contracts,
      ${fmt(S.stat.raids)} raids, ${fmt(S.stat.incidents)} matters settled out of the saddle.
      Ended with ${fmt(S.treasury)} florins and ${fmt(strength())} lances.</p>
    <div class="btnrow"><button class="btn primary" data-a="newco">Start a new company</button></div></div>`;
}

/* ------------------------------------------------------------- sheets - */
function openSheet(fn){ sheetFn = fn; renderSheet(); }
function closeSheet(){ sheetFn = null; renderSheet(); }
function renderSheet(){
  let host = $("#sheetHost");
  if(!sheetFn){ if(host) host.remove(); return; }
  if(!host){ host = document.createElement("div"); host.id = "sheetHost"; document.body.appendChild(host); }
  host.innerHTML = `<div class="scrim" data-a="scrim"><div class="sheet">${sheetFn()}</div></div>`;
  paintBanners();
}
function sheetMenu(){
  return `<h3>Menu</h3>
    <div class="btnrow" style="flex-direction:column">
      <button class="btn ghost" data-a="slots" data-v="save">Save to a slot</button>
      <button class="btn ghost" data-a="slots" data-v="load">Load from a slot</button>
      <button class="btn ghost" data-a="export">Copy company as text</button>
      <button class="btn ghost" data-a="import">Paste a company in</button>
      <button class="btn ghost" data-a="help">How this works</button>
      <button class="btn ghost" data-a="tut-on">Walk me through it again</button>
      <button class="btn ghost" data-a="newco">Abandon and start new</button>
      <button class="btn" data-a="scrim">Close</button></div>`;
}
function sheetHelp(){
  return `<h3>How this works</h3>
    <p class="lede">One season is one turn. Four seasons to a year, ten years to a career.</p>
    <div class="panel" style="margin-bottom:10px">
      <div class="kv"><span class="k">Take a condotta</span><span class="v">steady pay, a real fight</span></div>
      <div class="kv"><span class="k">Ride for composizione</span><span class="v">fast money, lasting enemies</span></div>
      <div class="kv"><span class="k">Rest</span><span class="v">loyalty back, nothing earned</span></div>
    </div>
    <p class="lede"><b>Dread</b> gets you hired at better rates. <b>Honor</b> keeps the cities from
    leaguing against you. Raiding buys the first and spends the second — that tension is the game.</p>
    <p class="lede"><b>To win:</b> bank ${fmt(CONFIG.winTreasury)} florins <em>and</em> get one faction's
    regard to ${CONFIG.winReputation}, after the twentieth season. Chasing the best rate every season is
    safer; committing to one employer is how you actually get taken off the road.</p>
    <p class="lede"><b>To lose:</b> loyalty reaching nothing, or two unpaid seasons with trust already

function sheetSlots(mode){
  const rows = [1,2,3].map(i => {
    const o = slotRead(i);
    const c = o ? stateCard(o) : null;
    return `<div class="slotrow"><span class="info">Slot ${i} — ${c ? `${esc(c.name)}, ${c.when}, ${fmt(c.worth)} fl.` : "empty"}</span>
      <button class="btn sm${mode==="save"?" primary":""}" data-a="slot-${mode==="save"?"put":"get"}" data-v="${i}"${mode==="load"&&!c?" disabled":""}>
      ${mode==="save"?"Keep here":"Open"}</button></div>`;
  }).join("");
  return `<h3>${mode==="save"?"Save to a slot":"Load from a slot"}</h3>${rows}
    <div class="btnrow" style="margin-top:12px"><button class="btn" data-a="scrim">Close</button></div>`;
}
function sheetExport(){
  return `<h3>Copy this company</h3><p class="lede">Paste this somewhere safe. Paste it back in on any device to continue.</p>
    <textarea class="blob" id="saveblob" readonly>${exportText()}</textarea>
    <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-a="copyblob">Copy</button>
    <button class="btn ghost" data-a="scrim">Close</button></div>`;
}
function sheetImport(){

    <textarea class="blob" id="loadblob" placeholder="Paste the text here"></textarea>
    <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-a="doimport">Open it</button>

}
function sheetBanner(){
  return `<h3>Your arms</h3><p class="lede">Roll until something looks like you.</p>
    <div class="bigbanner">${bannerHTML("sheetBig", S.banner, 4)}</div>
    <div class="btnrow" style="margin-bottom:10px"><button class="btn gold" data-a="rollbanner2">Roll a new one</button></div>
    <div class="bannergrid">${BANNER_PRESETS.slice(0,12).map(seed =>
      `<button class="bannerpick${S.banner===seed?" sel":""}" data-a="setbanner" data-v="${seed}">

function sheetKit(slot){
  const labels = {armour:"Harness", horse:"Horse", blade:"Blade", wardrobe:"Finery"};
  return `<h3>${labels[slot]}</h3>
    <p class="lede">Bought once, worn always. Small effects; large impressions.</p>
    ${KIT[slot].map(k => {
      const owned = S.kit[slot] === k.id;
      const can = S.treasury >= k.cost;
      return `<button class="row${owned?" owned":""}" data-a="buykit" data-v="${slot}:${k.id}"${owned||!can?" disabled":""}>
        <span class="main"><span class="t">${k.name}${owned?" — worn":""}</span>
        <span class="s">${k.note}${k.dread?` &middot; +${k.dread} dread`:""}${k.presence?` &middot; +${k.presence} presence`:""}</span></span>
        <span class="end">${owned ? "&#10003;" : (k.cost ? `${fmt(k.cost)} fl.` : "—")}</span></button>`;
    }).join("")}
    <div class="btnrow"><button class="btn" data-a="scrim">Close</button></div>`;
}
function sheetIncident(){
  const inc = pendingIncident;
  if(!inc) return `<h3>Nothing pressing</h3><div class="btnrow"><button class="btn" data-a="scrim">Close</button></div>`;
  return `<h3>${inc.title}</h3>
    <p class="lede">${esc(fill(inc.text))}</p>
    <div class="btnrow" style="flex-direction:column">
      ${inc.choices.map((c,i) => {
        const cant = c.cost && S.treasury < c.cost;
        return `<button class="btn ghost" data-a="incident" data-v="${i}"${cant?" disabled":""}>${c.t}${cant?" — not enough":""}</button>`;
      }).join("")}</div>`;
}
function toast(text){
  const host = $("#toastHost");
  host.innerHTML = `<div class="toast show">${esc(text)}</div>`;
  setTimeout(() => { const t = host.querySelector(".toast"); if(t) t.classList.remove("show"); }, 2000);
}

/* ------------------------------------------------------------ wiring - */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if(a === "scrim" && (e.target === t || t.tagName === "BUTTON")){ closeSheet(); return; }
  if(t.disabled || a === "noop") return;

  const nameInput = $("#cname");
  if(nameInput && build) build.name = nameInput.value;

  switch(a){
    case "newco":
      S = null; closeSheet();
      build = {step:1, name:"", pick:"balanced", banner:randomSeed(), difficulty:"captain",
        attrs:Object.fromEntries(ATTRS.map(x => [x.id, ATTR_BASE]))};
      render(); break;
    case "continue": if(load()) render(); else { toast("No company on this device."); render(); } break;
    case "titleback": build = null; render(); break;
    case "pickbuild": build.pick = v; render(); break;
    case "step1": build.step = 1; render(); break;
    case "step2": build.step = 2; render(); break;
    case "step3": build.step = 3; render(); break;
    case "attr+": {
      const spent = ATTRS.reduce((acc,x) => acc + (build.attrs[x.id]-ATTR_BASE), 0);
      if(spent < ATTR_POINTS && build.attrs[v] < ATTR_MAX) build.attrs[v]++;
      render(); break; }
    case "attr-": if(build.attrs[v] > ATTR_BASE) build.attrs[v]--; render(); break;
    case "rollbanner": build.banner = randomSeed(); render(); break;
    case "pickbanner": build.banner = v; render(); break;
    case "pickdiff": build.difficulty = v; render(); break;
    case "startgame": {
      const name = (build.name||"").trim() || "the Captain";
      const b = BUILDS.find(x => x.id === build.pick) || BUILDS[0];
      newGame(name, b, build.attrs, build.banner, build.difficulty);
      build = null; render();
      if(!S.tutorial.done) openSheet(sheetIntro);
      break; }

    case "go": S.tab = v; S.seen["tab_"+v] = true; save(); render(); window.scrollTo(0,0); break;
    case "hint-seen": S.seen[v] = true; save(); render(); break;
    case "tut-off": S.tutorial.done = true; save(); render(); toast("Guidance off. It is in the menu if you want it back."); break;
    case "tut-skip": S.tutorial.done = true; S.tutorial.step = 0; closeSheet(); save(); render(); break;
    case "tut-next": {
      S.tutorial.step = (S.tutorial.step || 0) + 1;
      if(S.tutorial.step >= INTRO.length){ S.tutorial.step = 0; closeSheet(); }
      else renderSheet();
      save(); render(); break; }
    case "tut-on": S.tutorial = {step:0, done:false}; S.seen = {}; closeSheet(); save(); render();
      openSheet(sheetIntro); break;
    case "menu": openSheet(sheetMenu); break;
    case "help": openSheet(sheetHelp); break;
    case "slots": openSheet(() => sheetSlots(v)); break;
    case "slot-put":
      if(slotWrite(+v)){ toast(`Kept in slot ${v}.`); closeSheet(); }
      else toast("Could not save — storage is full."); break;
    case "slot-get": {
      const o = slotRead(+v);
      if(!o){ toast("Nothing kept there."); break; }
      S = o; save(); closeSheet(); render(); toast("Opened."); break; }
    case "export": openSheet(sheetExport); break;
    case "import": openSheet(sheetImport); break;
    case "copyblob": {
      const ta = $("#saveblob"); if(!ta) break;
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      const done = () => toast("Copied.");
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(done, () => { try{ document.execCommand("copy"); done(); }catch(err){ toast("Copy it by hand — it is selected."); } });
      else { try{ document.execCommand("copy"); done(); }catch(err){ toast("Copy it by hand — it is selected."); } }
      break; }
    case "doimport": {
      const ta = $("#loadblob");
      const o = ta ? importText(ta.value) : null;
      if(!o){ toast("That is not a company this ledger recognises."); break; }
      S = o; save(); closeSheet(); render(); toast("Opened."); break; }

    case "bannersheet": openSheet(sheetBanner); break;
    case "rollbanner2": S.banner = randomSeed(); save(); renderSheet(); render(); break;
    case "setbanner": S.banner = v; save(); renderSheet(); render(); break;
    case "kitsheet": openSheet(() => sheetKit(v)); break;
    case "buykit": {
      const [slot, id] = v.split(":");
      const k = KIT[slot].find(x => x.id === id);
      if(!k || S.treasury < k.cost) break;
      if(k.cost) coin(-k.cost, k.name);
      S.kit[slot] = id;
      post("", `You took up ${k.name.charAt(0).toLowerCase()}${k.name.slice(1)}.`);
      save(); closeSheet(); render(); toast("Worn."); break; }
    case "dpick": {
      if(S.doctrine.picked.length >= DOCTRINE_PICKS || docPicked(v)) break;
      const d = docDef(v); if(!d) break;
      S.doctrine.picked.push(v);
      S.doctrine.tier[v] = 1;
      post("gold", `The company takes up ${d.name}. ${d.steps[0]}`);
      save(); render(); toast(`${d.name} — first step.`);
      break; }
    case "dstep": {
      const d = docDef(v); if(!d || !docPicked(v)) break;
      const t = docTier(v);
      if(t >= DOCTRINE_MAX) break;
      const cost = DOCTRINE_COST[t];
      if(S.treasury < cost || d.proof(S) < d.need[t]) break;
      coin(-cost, `${d.name}, step ${t+1}`);
      S.doctrine.tier[v] = t + 1;
      post("gold", `${d.name}, step ${t+1}: ${d.steps[t]}`);
      save(); render(); toast(`${d.name} — step ${t+1}.`);
      break; }
    case "invest": {
      const i = invDef(v);
      if(!i || has(v) || S.treasury < i.cost) break;
      coin(-i.cost, i.name);
      S.investments.push(v);
      post("gold", `${i.name} — ${i.note}`);
      save(); render(); toast(`${i.name} secured.`); break; }

    case "incident": {
      const inc = pendingIncident;
      if(!inc) { closeSheet(); break; }
      const c = inc.choices[+v];
      if(!c) break;
      if(c.cost && S.treasury < c.cost) break;
      const outcome = c.fx(S);
      S.stat.incidents++;
      post("gold", typeof outcome === "string" ? fill(outcome) : inc.title);
      pendingIncident = null;
      save(); closeSheet(); render(); break; }

    case "contract": runSeason("contract", +v); break;
    case "campaign": runSeason("campaign"); break;
    case "breakcamp": breakCampaign(); save(); render(); break;
    case "order": {
      const b = S.battle; if(!b || b.over) break;
      resolveRound(b, v);
      if(b.over) endBattle(); else { save(); render(); }
      break; }
    case "reserve": {
      const b = S.battle; if(!b || b.reserveUsed) break;
      b.reserveUsed = true; b.us.committed = true;
      post("", "The reserve went in.");
      save(); render(); toast("Reserve committed — this round counts double.");
      break; }
    case "autobattle": {
      const b = S.battle; if(!b) break;
      autoResolve(b); endBattle(); break; }
    case "siege": siegeAction(v); break;
    case "raid": runSeason("raid"); break;
    case "rest": runSeason("rest"); break;
  }
});

/* --------------------------------------------------------------- boot - */
if(!load()) S = null;
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
