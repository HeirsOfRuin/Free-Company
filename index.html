<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14120F">
<meta name="description" content="The Company: a free company of mercenaries in Italy, 1360s. Contract, raid or rest — and live with what your name is worth.">
<title>The Company</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#14120F; --ground-2:#0F0D0B; --panel:#221E1A; --panel-hi:#2C2620;
  --line:#3A332B; --line-soft:#2A241F; --text:#E8DFC9; --muted:#A99C86; --dim:#7A6E5C;
  --iron:#8A9199; --iron-hi:#B7BFC6; --iron-dim:#4A5057;
  --blood:#9C3A3A; --gold:#C9A227; --gold-hi:#E0BC4C; --steel:#5B6B79; --parchment:#D8C9A3;
  --green:#6FAE7C;
  --shadow:0 10px 30px rgba(0,0,0,.5); --r:10px;
  --f-disp:"Cinzel","Iowan Old Style",Georgia,serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--f-ui);font-size:16px;
  line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--blood)}.warn{color:var(--gold-hi)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

.frame{max-width:600px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:24px;
  background:linear-gradient(180deg,#1B1712 0%,var(--ground) 260px);
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
@media (max-width:620px){.frame{border:0}}

#hud{position:sticky;top:0;z-index:40;background:rgba(15,13,11,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hud-top{display:flex;align-items:center;gap:10px;padding:9px 14px 6px}
.hud-banner{flex:none;width:34px;height:44px;border:1px solid var(--line);background:var(--panel)}
.coname{flex:1;font-family:var(--f-disp);font-size:16px;line-height:1.15;color:var(--parchment);min-width:0}
.coname small{display:block;font-family:var(--f-ui);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:3px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{text-align:right;font-size:11.5px;color:var(--muted);letter-spacing:.04em;flex:none}
.date b{display:block;font-family:var(--f-num);font-size:14px;color:var(--text);font-weight:500}
#menuBtn{flex:none;width:36px;height:36px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);color:var(--muted);font-size:16px;line-height:1;cursor:pointer}
#menuBtn:active{background:var(--panel-hi)}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 14px 10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chip .k{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.chip .v{display:block;font-family:var(--f-num);font-size:14px;margin-top:2px}

#nav{display:flex;border-top:1px solid var(--line-soft)}
#nav button{flex:1;background:transparent;border:0;border-top:2px solid transparent;
  padding:8px 2px 9px;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.04em;cursor:pointer}
#nav button[aria-current]{color:var(--gold-hi);border-top-color:var(--gold);background:rgba(201,162,39,.06)}
#nav .badge{display:inline-block;min-width:15px;padding:0 3px;margin-left:3px;border-radius:7px;
  background:var(--blood);color:#fff;font-size:9px;line-height:15px;font-family:var(--f-num)}

main{padding:4px 14px 40px}
.sec{margin:16px 0}
.sec h2{font-size:14.5px;color:var(--parchment);margin-bottom:8px}
.lede{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.empty{font-size:12.5px;color:var(--dim);font-style:italic;padding:10px;border:1px dashed var(--line);
  border-radius:var(--r);text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}

.repline{display:flex;align-items:center;gap:8px;padding:5px 0}
.repline .f{flex:1.2;font-size:13px}
.repline .bar{flex:1.3;height:6px;border-radius:3px;background:var(--line-soft);position:relative;overflow:hidden}
.repline .bar i{position:absolute;top:0;bottom:0}
.repline .n{width:34px;text-align:right;font-family:var(--f-num);font-size:12px}
.facnote{font-size:11.5px;color:var(--dim);padding:0 0 8px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}

.offer{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:9px;cursor:pointer;color:inherit;display:block}
.offer:active{background:var(--panel-hi)}
.offer .t{font-size:14px;font-weight:600;color:var(--parchment)}
.offer .s{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.offer .pay{float:right;font-family:var(--f-num);color:var(--gold-hi);font-size:14px}
.offer .undercut{display:block;font-size:11.5px;color:var(--blood);margin-top:4px}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{flex:1;min-width:120px;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel-hi);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.9)}
.btn.primary{background:var(--blood);border-color:#B24949;color:#fff}
.btn.ghost{background:transparent}
.btn.gold{background:var(--gold);border-color:var(--gold-hi);color:#241C05}
.btn.sm{flex:none;padding:7px 11px;font-size:12.5px;min-width:0}
.btn:disabled{opacity:.38;cursor:default}

.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;color:inherit;cursor:pointer}
.row:active{background:var(--panel-hi)}
.row .main{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:600;color:var(--parchment)}
.row .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.row .end{flex:none;font-family:var(--f-num);font-size:12.5px;text-align:right}
.row.owned{border-color:var(--gold-dim,#6a5518);background:#241F13}
.row.flat{cursor:default}
.rivbanner{flex:none;width:24px;height:31px;border:1px solid var(--line)}

.journal{display:flex;flex-direction:column;gap:0}
.jrow{padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.jrow:last-child{border-bottom:0}
.jrow .w{color:var(--dim);font-size:10.5px;display:block;margin-bottom:2px;letter-spacing:.03em}
.jrow.good{color:var(--text)}.jrow.bad{color:#D3A0A0}.jrow.gold{color:var(--gold-hi)}

.attr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.attr:last-child{border-bottom:0}
.attr .an{flex:1;font-size:13px}
.attr .an small{display:block;font-size:11px;color:var(--dim)}
.attr .pips{flex:none;font-family:var(--f-num);font-size:13px;color:var(--gold-hi);letter-spacing:2px}

.scrim{position:fixed;inset:0;background:rgba(10,8,6,.74);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--ground-2);
  border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h3{font-size:16px;margin-bottom:6px;color:var(--parchment)}
.sheet .lede{margin-bottom:12px}
.slotrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.slotrow:last-child{border-bottom:0}
.slotrow .info{font-size:12.5px;color:var(--muted)}
textarea.blob{width:100%;min-height:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:var(--f-num);font-size:11px;padding:8px;resize:vertical}

.bannergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.bannerpick{padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.bannerpick.sel{border-color:var(--gold);background:var(--panel-hi)}
.bannerpick canvas{width:44px;height:56px}
.bigbanner{display:flex;justify-content:center;margin:6px 0 12px}
.bigbanner canvas{width:96px;height:124px;border:1px solid var(--line)}

.tut,.hint{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 12px;border-radius:var(--r)}
.tut{border:1px solid var(--gold-dim,#6a5518);background:linear-gradient(180deg,#2A2312,#1F1B12)}
.hint{border:1px dashed var(--line);background:var(--panel)}
.tut .main,.hint .main{flex:1;font-size:12.5px;line-height:1.5}
.tut .main{color:var(--parchment)}
.hint .main{color:var(--muted)}

.bfwrap{display:flex;justify-content:center}
.battlefield{width:100%;max-width:344px;height:auto;border:1px solid var(--line);border-radius:6px}
.camp-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;
  border:1px solid var(--gold-dim,#6a5518);background:#241F13;border-radius:var(--r)}
.camp-strip .main{flex:1}
.camp-strip .t{font-size:13.5px;color:var(--parchment);font-weight:600}
.camp-strip .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel-hi);
  border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;z-index:90;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}

.title-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:26px 20px;text-align:center}
.title-wrap h1{font-size:38px;color:var(--parchment)}
.title-wrap .sub{color:var(--muted);font-size:13.5px;margin:10px 0 26px}
.title-wrap .btn{margin-bottom:10px}
.build{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:9px;
  text-align:left;cursor:pointer;color:inherit;width:100%;display:block}
.build.sel{border-color:var(--gold);background:var(--panel-hi)}
.build .t{font-weight:700;color:var(--parchment);font-size:13.5px}
.build .s{font-size:12px;color:var(--muted);display:block;margin-top:3px}
input.name{width:100%;padding:11px 13px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;margin-bottom:12px}
.step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}

.over{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px 20px;text-align:center}
.over h1{font-size:26px;margin-bottom:12px}
.over p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:18px}
</style>
</head>
<body>
<div class="frame" id="app"></div>
<div id="toastHost"></div>
<script>
/* =================================================================
   THE COMPANY — Italy, 1360s.
   Single file, no build step, no server, no API key.

   Tuning constants are ported from the validated kill-gate
   simulation in prototypes/the_company_sim.py. If a number here
   needs to change, change it there first, rerun the sim, and only
   then change it here.

   All HTML is built with template literals, deliberately: an
   apostrophe inside a single-quoted string literal blanked this
   whole page once already.
   ================================================================= */

/* ---------------------------------------------------------- config - */
const CONFIG = {
  seasonsPerYear: 4,
  startYear: 1361,
  totalSeasons: 40,              // 10 years — the validated kill-gate horizon.
                                 // Do not extend without rerunning the sim:
                                 // 160 seasons pushed win rate ~1% -> ~23%.
  winTreasury: 18000,
  winReputation: 60,
  winEligibleFromSeason: 20,
  maxLancesMult: 1.5,
  recruitCostPerLance: 13,
  recruitRateCap: 20,
  recruitTreasuryBuffer: 800,
  dreadDecay: 0.95,
  repDecay: 0.98,
  mutinyTreasuryStrikes: 2,
  mutinyLoyaltyCeilingForStrikes: 30,
  /* storage keys — permanent. Renaming orphans every existing save. */
  saveKey: "the-company-v1",
  slotKey: "the-company-slot-v1-"
};

const SEASONS = ["Spring","Summer","Autumn","Winter"];
const WINTER_IDX = 3;
const seasonOf = t => SEASONS[t % CONFIG.seasonsPerYear];
const yearOf = t => CONFIG.startYear + Math.floor(t / CONFIG.seasonsPerYear);

/* ----------------------------------------------------------- data - */
const FACTIONS = [
  {id:"florence", name:"Florence", short:"Florence",
   note:"Merchant money, slow to pay and long of memory. Pays late; forgets nothing, good or bad.",
   payBias:0.98, riskBias:0.95, loyaltyMemory:1.35},
  {id:"milan", name:"Milan", short:"Milan",
   note:"Visconti gold, and Visconti terms. The best rates in Italy, offered by men who break faith first.",
   payBias:1.14, riskBias:1.10, loyaltyMemory:0.75},
  {id:"papal", name:"the Papal States", short:"Papal States",
   note:"Legates, tithes and the threat of excommunication. Crosses a captain at his peril.",
   payBias:1.02, riskBias:1.00, loyaltyMemory:1.00, excommunicates:true},
  {id:"pisa", name:"Pisa", short:"Pisa",
   note:"Poor, proud and desperate. Pays badly because it cannot pay well, and knows it.",
   payBias:0.86, riskBias:1.15, loyaltyMemory:1.15},
  {id:"padua", name:"Padua", short:"Padua",
   note:"Small, careful, and grateful for a company that keeps its word. Carrara pay in full or not at all.",
   payBias:0.94, riskBias:0.90, loyaltyMemory:1.45}
];
const facOf = id => FACTIONS.find(f => f.id === id);

const DIFFICULTY = {
  condottiere:{name:"Condottiere", note:"Rates are good and the field is kind. For learning the road.",
    pay:1.15, risk:0.85, coalition:0.75},
  captain:{name:"Captain", note:"The road as it was. The balance the simulation was tuned against.",
    pay:1.00, risk:1.00, coalition:1.00},
  adventurer:{name:"Adventurer", note:"Thin pay, hard fields, and leagues that form quickly.",
    pay:0.88, risk:1.20, coalition:1.35}
};

/* Unit types. Upkeep is per head per season; the default composition below
   comes out within ~1% of the scalar figure the economy was validated
   against (200 lances x (3 + 4*0.5) = 1,000), so the swap does not move the
   ledger on its own. */
const UNITS = {
  maa:  {id:"maa",  name:"Men-at-arms",     short:"Men-at-arms", upkeep:8.0, recruit:22,
         note:"Heavy horse and heavy foot. They hold, and they charge."},
  arch: {id:"arch", name:"Mounted archers", short:"Archers",     upkeep:5.0, recruit:15,
         note:"The English trick that changed this trade. Deadly at range, badly exposed if reached."},
  inf:  {id:"inf",  name:"Brigands",        short:"Brigands",    upkeep:2.6, recruit:7,
         note:"Cheap, numerous, replaceable. They screen and they hold ground, until they do not."}
};
const UNIT_IDS = ["maa","arch","inf"];

const BUILDS = [
  {id:"balanced", name:"A balanced company", units:{maa:60, arch:70, inf:70}, quality:0.50, treasury:2000,
   blurb:"Even numbers, even pay. No particular edge, no particular weakness."},
  {id:"heavy", name:"Uomini d'arme — heavy lances", units:{maa:75, arch:45, inf:50}, quality:0.60, treasury:1800,
   blurb:"Fewer men, better trained, dearer to keep. Wins more of the fights it takes."},
  {id:"free", name:"Free riders — light and many", units:{maa:40, arch:70, inf:120}, quality:0.40, treasury:2200,
   blurb:"Numerous and cheap to replace. Loses more fights, but a bad season costs less to fix."}
];

/* ------------------------------------------------------------ the field -
   Terrain multiplies the effectiveness of each order. This table is what
   stops one order from being correct everywhere. */
const TERRAIN = {
  open:   {id:"open",   name:"Open field",       hold:0.85, volley:1.20, charge:1.25,
           refuse:0.90, tint:"#3E4A2E", note:"Room to manoeuvre, and nowhere to hide."},
  broken: {id:"broken", name:"Broken ground",    hold:1.20, volley:0.85, charge:0.65,
           refuse:1.10, tint:"#4A3F2E", note:"Ditches, vine terraces and field walls. No country for horses."},
  river:  {id:"river",  name:"A river crossing", hold:1.20, volley:1.00, charge:0.50,
           refuse:1.05, tint:"#2E404A", note:"They must come to you through the water."},
  hills:  {id:"hills",  name:"The high ground",  hold:0.95, volley:1.25, charge:0.80,
           refuse:1.00, tint:"#3A3A2C", note:"A long view of the approach, and the slope on your side."},
  defile: {id:"defile", name:"A defile",         hold:1.35, volley:0.75, charge:0.45,
           refuse:1.15, tint:"#2C2A26", note:"A narrow place. Numbers count for very little here."}
};
const TERRAIN_IDS = Object.keys(TERRAIN);

/* Orders. `power` reads a composition and returns raw effect; `losses` is
   how that order distributes the casualties it takes across unit types;
   `defence` scales casualties taken. */
const ORDERS = {
  hold: {
    id:"hold", name:"Dismount and hold", verb:"held the line on foot",
    line:"Men-at-arms afoot in close order. The company's oldest answer.",
    power: u => u.maa*1.10 + u.inf*0.70 + u.arch*0.30,
    losses:{maa:0.50, inf:0.40, arch:0.10}, defence:0.70, moraleSelf:2,
    need:(u,t) => frac(u,"maa") >= 0.15,
    why:"Needs men-at-arms enough to form a line — at least a sixth of the company."
  },
  volley: {
    id:"volley", name:"Loose a volley", verb:"shot them up at range",
    line:"Archers forward. Hurt them before they ever reach you.",
    power: u => u.arch*1.30 + u.maa*0.20 + u.inf*0.20,
    losses:{maa:0.20, inf:0.35, arch:0.45}, defence:0.90, moraleSelf:1,
    need:(u,t) => frac(u,"arch") >= 0.10,
    why:"Needs archers — at least a tenth of the company."
  },
  charge: {
    id:"charge", name:"Sound the charge", verb:"went in mounted",
    line:"Horse, at speed, at whatever is in front. Decisive or ruinous.",
    power: u => u.maa*1.50 + u.arch*0.50 + u.inf*0.30,
    losses:{maa:0.60, arch:0.20, inf:0.20}, defence:1.30, moraleSelf:0,
    need:(u,t,b,doc) => {
      let tm = TERRAIN[t].charge;
      if(doc && doc.chargeSoften && tm < 1) tm = tm + (1 - tm) * doc.chargeSoften;
      return frac(u,"maa") >= 0.20 && tm >= 0.75;
    },
    why:"Needs a fifth of the company in men-at-arms, and ground a horse can cross."
  },
  refuse: {
    id:"refuse", name:"Refuse the flank", verb:"gave ground in good order",
    line:"Give ground, keep the line, save the company. You will not win the day this way.",
    power: u => u.maa*0.62 + u.inf*0.58 + u.arch*0.42,
    losses:{maa:0.30, arch:0.20, inf:0.50}, defence:0.45, moraleSelf:-6,
    need:() => true, why:""
  }
};
const ORDER_IDS = ["hold","volley","charge","refuse"];

/* The triangle. COUNTER[mine][theirs] scales my effectiveness.
   Volley beats hold (a static formation is a target); charge beats volley
   (closing is the answer to bowmen); hold beats charge (braced men stop
   horses — the White Company's actual trick). */
const COUNTER = {
  hold:   {hold:1.00, volley:0.75, charge:1.40, refuse:1.05},
  volley: {hold:1.35, volley:1.00, charge:0.88, refuse:1.10},
  charge: {hold:0.70, volley:1.25, charge:1.00, refuse:1.15},
  refuse: {hold:0.90, volley:0.85, charge:0.90, refuse:1.00}
};

const PROFILES = {
  condottiere:{id:"condottiere", name:"a condottiere company",
    note:"Professionals. They will take the ground if you let them.", prefer:["charge","volley","hold","refuse"]},
  militia:{id:"militia", name:"communal militia",
    note:"Townsmen with good crossbows and no wish to die for the commune.", prefer:["hold","volley","refuse","charge"]},
  levy:{id:"levy", name:"a feudal levy",
    note:"Knights who have read about war in poems.", prefer:["charge","charge","hold","refuse"]}
};

/* Captain attributes. Light mechanics, by design — these shape who the
   captain is and how events read, and nudge the numbers slightly. They
   are not a second economy. */
const ATTRS = [

       return "You sent it back unsigned. Let them wonder what the company is for."; }}]},

  {id:"oldfriend", weight:2,
   when:s => s.turn > 12 && s.rivals.length > 0,
   title:"A rival captain proposes terms",
   text:"{riv} suggests the two companies stop underbidding each other. Split the season, split the country, and let the cities pay properly for once.",
   choices:[
     {t:"Agree to the carve-up", fx:s => { s.flags.pact=1; s.honor=Math.max(0,s.honor-6); s.dread=Math.min(100,s.dread+5);
       return "A gentleman's arrangement between two men who are not gentlemen. Rates went up immediately."; }},
     {t:"Refuse and undercut him", fx:s => { s.flags.feudWith=1; rep(s,"florence",4);
       return "You went straight to his employer with a better price. There is no going back from that."; }}]}
];

/* ----------------------------------------------------------- helpers - */
function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function rand(lo, hi){ return lo + Math.random() * (hi - lo); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function $(sel){ return document.querySelector(sel); }
function rep(s, facId, delta){
  if(delta > 0) delta *= mods().repGain;
  s.reputation[facId] = clamp(s.reputation[facId] + delta, -100, 100);
}

/* seeded PRNG for heraldry only — the game itself uses Math.random */
function hashStr(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rpick(r, arr){ return arr[Math.floor(r() * arr.length)]; }

/* --------------------------------------------------- banner generator -
   The generator IS the asset: only a short seed string is persisted, so
   there is no art pipeline and nothing to lose when a directory is
   cleared. Heraldry's metal-on-colour rule is what makes the output read
   as arms rather than noise. */
function bannerSpec(seed){
  const r = mulberry32(hashStr(String(seed)));
  const fieldIsMetal = r() < 0.45;
  const fieldPool = fieldIsMetal ? METALS : COLOURS;
  const otherPool = fieldIsMetal ? COLOURS : METALS;
  const t1 = rpick(r, fieldPool);
  const t2 = rpick(r, otherPool);
  const division = rpick(r, DIVISIONS);
  /* A charge sits across BOTH field tinctures on a divided field, so it
     must differ from each of them or it vanishes over half the banner —
     the contact sheet had a white cross disappearing into white stripes.
     On a plain field t2 is never drawn, so it carries no constraint. */
  let pool = otherPool;
  if(division !== "plain"){
    const narrowed = otherPool.filter(t => t !== t2);
    if(narrowed.length) pool = narrowed;
  }
  return { t1, t2, division, charge: rpick(r, CHARGE_IDS), chargeT: rpick(r, pool) };
}
const BW = 22, BH = 28;  // banner grid, in cells
function drawBanner(canvas, seed, scale){
  const spec = bannerSpec(seed);
  const ctx = canvas.getContext("2d");
  canvas.width = BW * scale; canvas.height = BH * scale;
  ctx.imageSmoothingEnabled = false;
  const c1 = TINCTURES[spec.t1], c2 = TINCTURES[spec.t2];
  const cell = (x,y,col) => { ctx.fillStyle = col; ctx.fillRect(x*scale, y*scale, scale, scale); };

  for(let y=0;y<BH;y++){
    for(let x=0;x<BW;x++){
      let col = c1;
      const half = BW/2, halfY = BH/2;
      switch(spec.division){
        case "perPale":    col = x < half ? c1 : c2; break;
        case "perFess":    col = y < halfY ? c1 : c2; break;
        case "quarterly":  col = ((x<half) === (y<halfY)) ? c1 : c2; break;
        case "perBend":    col = (x/BW + y/BH) < 1 ? c1 : c2; break;
        case "perSaltire": col = (Math.abs(x/BW-0.5) > Math.abs(y/BH-0.5)) ? c1 : c2; break;
        case "perChevron": col = (y/BH) > (0.35 + Math.abs(x/BW-0.5)) ? c2 : c1; break;
        case "barry":      col = (Math.floor(y/4) % 2) ? c2 : c1; break;
        case "paly":       col = (Math.floor(x/4) % 2) ? c2 : c1; break;
        default:           col = c1;
      }
      cell(x,y,col);
    }
  }
  // charge, centred
  const g = CHARGES[spec.charge];
  const ox = Math.floor((BW - 11)/2), oy = Math.floor((BH - 11)/2);
  for(let y=0;y<g.length;y++){
    for(let x=0;x<g[y].length;x++){
      if(g[y][x] !== "#") continue;
      cell(ox+x, oy+y, TINCTURES[spec.chargeT]);
    }
  }
  // staff
  ctx.fillStyle = "#4A3B28";
  ctx.fillRect(0, 0, Math.max(1, Math.floor(scale*0.8)), BH*scale);
  return spec;
}
/* Draw a banner into an existing context at an offset, for the battle
   diagram. Shares bannerSpec with drawBanner, so a company's arms are the
   same arms wherever they fly. */
function drawBannerAt(ctx, seed, ox, oy, scale, w, h){
  const spec = bannerSpec(seed);
  w = w || 11; h = h || 14;
  const c1 = TINCTURES[spec.t1], c2 = TINCTURES[spec.t2];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let col = c1; const half=w/2, halfY=h/2;
      switch(spec.division){
        case "perPale":    col = x<half ? c1 : c2; break;
        case "perFess":    col = y<halfY ? c1 : c2; break;
        case "quarterly":  col = ((x<half)===(y<halfY)) ? c1 : c2; break;
        case "perBend":    col = (x/w + y/h) < 1 ? c1 : c2; break;
        case "perSaltire": col = (Math.abs(x/w-0.5) > Math.abs(y/h-0.5)) ? c1 : c2; break;
        case "perChevron": col = (y/h) > (0.35 + Math.abs(x/w-0.5)) ? c2 : c1; break;
        case "barry":      col = (Math.floor(y/2)%2) ? c2 : c1; break;
        case "paly":       col = (Math.floor(x/2)%2) ? c2 : c1; break;
      }
      ctx.fillStyle = col;
      ctx.fillRect((ox+x)*scale, (oy+y)*scale, scale, scale);
    }
  }
  const g = CHARGES[spec.charge], gx = ox + Math.floor((w-11)/2), gy = oy + Math.floor((h-11)/2);
  ctx.fillStyle = TINCTURES[spec.chargeT];
  for(let y=0;y<g.length;y++) for(let x=0;x<g[y].length;x++){
    if(g[y][x] !== "#") continue;
    const px = gx+x, py = gy+y;
    if(px < ox || px >= ox+w || py < oy || py >= oy+h) continue;
    ctx.fillRect(px*scale, py*scale, scale, scale);
  }
}

const UNIT_COLOUR = {maa:"#B7BFC6", arch:"#C9A227", inf:"#8C6A4A"};
const BDW = 86, BDH = 46;
/* The battle diagram. Strips are drawn from b.us.units / b.them.units —
   the very objects resolveRound mutates — so what the player sees thinning
   is the same number that decides the fight. No display copy exists. */
function drawBattle(canvas, b, scale){
  const ctx = canvas.getContext("2d");
  canvas.width = BDW*scale; canvas.height = BDH*scale;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = TERRAIN[b.terrain].tint;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(0, (BDH/2-1)*scale, canvas.width, 2*scale);

  drawBannerAt(ctx, S.banner, 2, 3, scale, 11, 14);
  drawBannerAt(ctx, b.them.banner, BDW-13, BDH-17, scale, 11, 14);

  const maxW = 44;
  const base = Math.max(strength(b.us.units), strength(b.them.units), 1);
  UNIT_IDS.forEach((k,i) => {
    const n = b.us.units[k];
    const w = Math.max(n > 0.5 ? 1 : 0, Math.round(maxW * (n/base)));
    ctx.fillStyle = UNIT_COLOUR[k];
    ctx.fillRect(16*scale, (4 + i*4)*scale, w*scale, 3*scale);
  });
  UNIT_IDS.forEach((k,i) => {
    const n = b.them.units[k];
    const w = Math.max(n > 0.5 ? 1 : 0, Math.round(maxW * (n/base)));
    ctx.fillStyle = UNIT_COLOUR[k];
    ctx.fillRect((BDW-16-w)*scale, (BDH-7-i*4)*scale, w*scale, 3*scale);
  });

  const bar = (x,y,val,col) => {
    ctx.fillStyle = "#1A1713"; ctx.fillRect(x*scale, y*scale, 40*scale, 2*scale);
    ctx.fillStyle = col; ctx.fillRect(x*scale, y*scale, Math.round(40*val/100)*scale, 2*scale);
  };
  bar(16, 17, b.us.morale, b.us.morale <= 30 ? "#9C3A3A" : "#6FAE7C");
  bar(30, BDH-4, b.them.morale, b.them.morale <= 30 ? "#9C3A3A" : "#6FAE7C");
}
function battleCanvasHTML(id){ return `<canvas id="${id}" class="battlefield"></canvas>`; }
function paintBattle(){
  const cv = document.getElementById("bfield");
  if(cv && S.battle) drawBattle(cv, S.battle, 4);
}

function bannerHTML(id, seed, scale, cls){
  return `<canvas id="${id}" data-seed="${esc(seed)}" data-scale="${scale}" class="${cls||""}"></canvas>`;
}
function paintBanners(){
  document.querySelectorAll("canvas[data-seed]").forEach(cv => {
    drawBanner(cv, cv.dataset.seed, +cv.dataset.scale || 2);
  });
}
function randomSeed(){ return Math.random().toString(36).slice(2, 10); }

/* ------------------------------------------------------------- state - */
let S = null;
let build = null;
let sheetFn = null;
let pendingIncident = null;

/* ------------------------------------------------------- persistence - */
function save(){ try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(CONFIG.saveKey);
    if(!raw) return false;
    const o = JSON.parse(raw);
    const m = migrate(o);
    if(m){ S = m; return true; }
  }catch(e){}
  return false;
}
function wipe(){ try{ localStorage.removeItem(CONFIG.saveKey); }catch(e){} }

/* v1 saves predate lieutenants, rivals, investments, the captain sheet and
   the banner. They are migrated rather than discarded — a save on a
   player's device is a contract, not a label. */
function migrate(o){
  if(!o) return null;
  if(o.v === 1){
    o.v = 2;
    o.attrs = Object.fromEntries(ATTRS.map(a => [a.id, ATTR_BASE]));
    o.kit = {armour:"mail", horse:"rouncey", blade:"arming", wardrobe:"plain"};
    o.investments = [];
    o.banner = randomSeed();
    o.lieutenants = Array.from({length:4}, makeLieutenant);
    o.rivals = Array.from({length:3}, makeRival);
    o.difficulty = "captain";
    o.underContract = null;
    o.tab = "field";
    if(!o.stat) o.stat = {};
    o.stat.incidents = o.stat.incidents || 0;
    o.v = 2;   // fall through the v2 -> v3 composition split below
  }
  if(o.v === 2){
    /* Scalar strength becomes a composition. Split it in the ratio of
       whichever build this company started as, so a migrated save fields
       the army it always had rather than a default one. */
    const b = BUILDS.find(x => x.id === o.build) || BUILDS[0];
    const total = strength(b.units) || 1;
    const have = (typeof o.lances === "number" && o.lances > 0) ? o.lances : total;
    o.units = {}; o.startUnits = {};
    UNIT_IDS.forEach(k => {
      o.units[k] = Math.max(0, have * (b.units[k]/total));
      o.startUnits[k] = b.units[k];
    });
    delete o.lances; delete o.startLances;
    o.campaign = null; o.siege = null; o.battle = null;
    o.v = 3;
  }
  if(o.v === 3){
    o.doctrine = {picked:[], tier:{}};
    o.seen = {};
    /* An existing company has been on the road for years; it does not get
       walked through its first season. */
    o.tutorial = {step:0, done:true};
    o.v = 4;
  }
  if(o.v !== 4) return null;
  return repair(o);
}
function repair(o){
  if(!o.stat) o.stat = {seasons:0,contracts:0,raids:0,wonBattles:0,lostBattles:0,incidents:0};
  if(!o.flags) o.flags = {};
  if(!o.attrs) o.attrs = Object.fromEntries(ATTRS.map(a => [a.id, ATTR_BASE]));
  if(!o.kit) o.kit = {armour:"mail", horse:"rouncey", blade:"arming", wardrobe:"plain"};
  if(!Array.isArray(o.investments)) o.investments = [];
  if(!Array.isArray(o.lieutenants)) o.lieutenants = Array.from({length:4}, makeLieutenant);
  if(!Array.isArray(o.rivals)) o.rivals = Array.from({length:3}, makeRival);
  if(!o.banner) o.banner = randomSeed();
  if(!o.difficulty) o.difficulty = "captain";
  if(!o.tab) o.tab = "field";
  if(o.negTreasuryStrikes === undefined) o.negTreasuryStrikes = 0;
  if(!o.units){
    const b = BUILDS.find(x => x.id === o.build) || BUILDS[0];
    o.units = Object.assign({}, b.units);
  }
  if(!o.startUnits) o.startUnits = Object.assign({}, o.units);
  if(!o.doctrine) o.doctrine = {picked:[], tier:{}};
  if(!o.doctrine.tier) o.doctrine.tier = {};
  if(!Array.isArray(o.doctrine.picked)) o.doctrine.picked = [];
  if(!o.seen) o.seen = {};
  if(!o.tutorial) o.tutorial = {step:0, done:true};
  if(!o.stat.wonByOrder) o.stat.wonByOrder = {hold:0, volley:0, charge:0, refuse:0};
  if(o.stat.townsTaken === undefined) o.stat.townsTaken = 0;
  if(o.stat.saps === undefined) o.stat.saps = 0;
  if(o.stat.cleanPay === undefined) o.stat.cleanPay = 0;
  if(o.campaign === undefined) o.campaign = null;
  if(o.siege === undefined) o.siege = null;
  if(o.battle === undefined) o.battle = null;
  if(o.journalSeq === undefined) o.journalSeq = (o.journal||[]).length;
  if(o.underContract === undefined) o.underContract = null;
  return o;
}
const slotKey = i => CONFIG.slotKey + i;
function slotRead(i){
  try{ const raw = localStorage.getItem(slotKey(i)); if(!raw) return null;
    return migrate(JSON.parse(raw)); }catch(e){ return null; }
}
function slotWrite(i){
  try{ localStorage.setItem(slotKey(i), JSON.stringify(S)); return true; }catch(e){ return false; }
}
function stateCard(o){
  return { name:o.captainName, when:`${seasonOf(o.turn)} ${yearOf(o.turn)}`, worth:Math.round(o.treasury) };
}
function exportText(){
  const o = JSON.parse(JSON.stringify(S));
  o.ledger = (o.ledger||[]).slice(-60);
  o.journal = (o.journal||[]).slice(0, 40);

}
function importText(txt){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(txt.replace(/\s+/g,"")))));
    if(!o || typeof o.treasury !== "number") return null;
